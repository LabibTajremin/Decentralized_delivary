services:
  postgres:
    # PostGIS is not optional: ALG-01 and ALG-03 depend on ST_DWithin and
    # ST_Contains with a GiST index. See docs/decisions/0003-postgis-geospatial.md.
    image: postgis/postgis:16-3.4
    container_name: delivery-postgres
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Session and refresh-token store (P04). Refresh tokens are stored hashed
    # with a TTL so revocation and rotation are O(1) and expiry is automatic.
    # See docs/decisions/0005-redis-session-store.md.
    image: redis:7-alpine
    container_name: delivery-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-api
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: "postgres://delivery:delivery@postgres:5432/delivery?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  postgres-data:
  redis-data:

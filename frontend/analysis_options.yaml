# Lint rules shared by every package under frontend/.
#
# The backend holds exported Go symbols to a documented-or-fail standard
# (golangci-lint's revive rules, which have failed a phase for a missing doc
# comment before now). public_member_api_docs is the Dart equivalent, so the
# two halves of the codebase are held to one standard rather than two.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A warning nobody fixes is a warning nobody reads. CI treats the whole
    # analyzer output as pass/fail, so these are errors here too.
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  rules:
    - public_member_api_docs
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters

openapi: 3.1.0
info:
  title: Decentralized Delivery Platform API
  version: 0.1.0
  description: |
    Radius-scoped delivery marketplace for Bangladesh — food, grocery and pharmacy.

    Responses are display-ready: money arrives as both a minor-unit integer and a
    preformatted string, every breakdown line is precomputed, and any action the
    client may gate carries an explicit capability flag with a reason. The client
    performs no arithmetic and derives no permission
    (docs/build/05-architecture.md 2.9).
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: health
  - name: auth
  - name: config
    description: |
      Business rules an operator tunes at runtime — radius, fees, COD limits,
      dispatch bounds. Resolved per area (Appendix B) and never a deploy-time
      setting: a rule that needs a redeploy to change is a rule in the wrong
      place (ADR 0004).

      Every endpoint here requires the **admin** role, reads included: the
      effective configuration for an area states its COD limit, its fee bands
      and its discovery radius, which together describe how to price around the
      system.
  - name: me
    description: |
      The signed-in customer's own profile and address book. Every route acts
      on the caller's own data: the user id comes from the verified token, never
      from the request, because an endpoint that takes one from the client is an
      endpoint that will be asked for somebody else's home address.
  - name: partner
    description: |
      The delivery partner's app, and the operations sweep behind it. D4 lives
      here: a partner chooses between long and short distance work and is shown
      only the jobs inside their own radius, so the feed is not "every job"
      filtered by the client — it is a different list for every partner,
      computed by the server.
  - name: orders
    description: |
      The agreement between a customer and a shop: placed from a cart, moved
      through one transition table by whichever party owns the next step, and
      frozen at the prices the server worked out on the way in.
  - name: cart
    description: |
      The caller's own cart: one customer, one shop, one delivery address. Every
      read revalidates against the shop as it stands and reports what changed
      rather than quietly fixing it.
  - name: discovery
    description: |
      What a customer can order from, where they are standing. This is the
      decentralization model as an API: nationwide registration, local
      visibility (D1), expansion that costs more (D2), and a division boundary
      that expansion can never cross (D3).
  - name: geo
    description: |
      Administrative geography and spatial queries. Every distance in the system
      comes from here, so pricing, dispatch and the client all quote one number.
  - name: payments
    description: |
      Taking money through a gateway, and the ledger of cash a delivery partner
      is carrying. This is payment's whole public surface — everything else the
      module does happens through the order module's own transitions, never a
      route a person calls.
  - name: tracking
    description: |
      A live view of one delivery: the order's own status, and while a rider is
      carrying it, where they are. Server-Sent Events — one frame on connect,
      then one more each time something worth showing changes, until the order
      reaches a status with nothing left to watch.
  - name: notifications
    description: |
      Device registration for push, and the caller's own delivery history.
      Sending a notification is not a route a person calls — it happens through
      order's own transitions, the way a payment happens through a gateway.

      Isolated per ADR (05-architecture.md 2.6): built in Go today, ready to
      become a separate .NET service without any other module noticing, which
      is why every shape here is a primitive and nothing is shared with
      orders' own schemas.
  - name: reviews
    description: |
      Ratings and reviews for the three things a customer's opinion can be
      about — a merchant, a delivery partner, an item — and the support
      ticket queue a refund decision goes through. Eligibility for a review
      is checked against the order it names: only its own customer, only
      once it is delivered, and only for something that order actually
      involved.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Whether this instance should be sent traffic. Unlike `/healthz` it
        touches both stores, because an API that cannot reach Postgres or
        Redis can answer a probe and nothing else.

        The distinction matters to an orchestrator: a failed liveness check
        restarts the process, and restarting it because the database is down
        fixes nothing while taking the healthy replicas with it. A failed
        readiness check only takes this instance out of the load balancer,
        which is the correct response.
      security: []
      responses:
        "200":
          description: Ready for traffic
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ready }
        "503":
          description: A dependency could not be reached
          content:
            application/json:
              schema:
                type: object
                required: [status, dependency]
                properties:
                  status:     { type: string, example: unready }
                  dependency: { type: string, enum: [database, redis] }

  /v1/geo/resolve:
    get:
      tags: [geo]
      summary: Place a coordinate in the administrative hierarchy
      description: |
        Resolves a point to its area, district and division. Config resolution
        keys off this (area → district → division → global, Appendix B), so an
        address that cannot be placed cannot be priced or served.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double }, example: 23.7461 }
        - { name: lng, in: query, required: true, schema: { type: number, format: double }, example: 90.3742 }
      responses:
        "200":
          description: The point is inside the service area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "400":
          description: A parameter is missing or not a number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            The coordinate is valid but falls outside every division
            (`outside_service_area`). This is ordinary traffic from a place we
            do not cover yet, not a client fault — which is why it is not a 400.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/geo/merchants:
    get:
      tags: [geo]
      summary: Merchants within a radius, nearest first
      description: |
        Implements ALG-01. The division ceiling (D3) is part of the query, not a
        filter applied afterwards, so results can never cross a division
        boundary however large the radius.

        `distance_m` is the server's number. Clients render it and never
        recompute it: pricing bands off this same value, and two different
        distances for one journey is what 2.9 forbids.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - name: radius_m
          in: query
          required: true
          description: |
            Search radius in metres, 1 to 25000. This is a transport sanity
            bound only; the business radius for an area comes from the config
            module.
          schema: { type: number, format: double, minimum: 1, maximum: 25000 }
        - name: limit
          in: query
          description: Values above the maximum are clamped, not rejected.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Results, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [merchants, count, radius_m]
                properties:
                  merchants:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyMerchant" }
                  count:    { type: integer }
                  radius_m: { type: number, format: double }
        "400":
          description: A parameter is missing, not a number, or out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/geo/distance:
    get:
      tags: [geo]
      summary: Great-circle distance between two points
      description: |
        The single source of distance for the whole system. Pricing and dispatch
        call this rather than computing their own, so every quoted fee and every
        assignment decision agrees.
      security: []
      parameters:
        - { name: from_lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: from_lng, in: query, required: true, schema: { type: number, format: double } }
        - { name: to_lat,   in: query, required: true, schema: { type: number, format: double } }
        - { name: to_lng,   in: query, required: true, schema: { type: number, format: double } }
      responses:
        "200":
          description: The distance in metres
          content:
            application/json:
              schema:
                type: object
                required: [distance_m]
                properties:
                  distance_m: { type: number, format: double, example: 190700 }
        "400":
          description: A parameter is missing or not a valid coordinate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/definitions:
    get:
      tags: [config]
      summary: Every configurable variable with its bounds
      description: |
        The admin UI reads this to build its editor. Bounds and the
        auto-tunable flag are included so an admin knows what is allowed before
        submitting rather than after being rejected.

        `discovery.division_ceiling` appears with `immutable: true`. It is
        listed so it is visible and auditable, not so it is adjustable — it
        enforces D3 and nothing may change it.
      responses:
        "200":
          description: The full variable registry
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigDefinition" }
        "503":
          description: The settings store is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/effective:
    get:
      tags: [config]
      summary: The settings in force for one place
      description: |
        Resolves every variable for a placement, applying overrides
        area → district → division → global. Each value reports the scope it
        came from, which is what an admin needs to understand why a value is
        what it is.
      parameters:
        - { name: area,     in: query, schema: { type: string }, example: DHK-DHM }
        - { name: district, in: query, schema: { type: string }, example: DHK }
        - { name: division, in: query, schema: { type: string }, example: DHA }
      responses:
        "200":
          description: Every variable, resolved
          content:
            application/json:
              schema:
                type: object
                required: [values]
                properties:
                  values:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveValue" }
        "503":
          description: The settings store is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/overrides:
    put:
      tags: [config]
      summary: Set a variable at one scope
      description: |
        Applies an override and records it in the audit log, atomically. A
        reason is required: a log that answers "what changed" but never "why"
        does not answer the question people actually ask.

        Values are sent as strings, not JSON numbers. Money is in minor units
        and must never round-trip through a float (2.9).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetConfigOverride" }
      responses:
        "200":
          description: The change that was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigChange" }
        "400":
          description: |
            The value is out of bounds, the wrong type, unreadable, or no
            reason was given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: |
            The variable is immutable (`immutable_config_key`), or the
            auto-tuner attempted a variable it may not change
            (`not_auto_tunable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such variable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An admin has pinned this variable against auto-tuning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/override:
    delete:
      tags: [config]
      summary: Reset a variable to the next scope up
      description: |
        Removes one override so the next level applies again, and records the
        removal. The global value is the fallback that makes resolution total
        and cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearConfigOverride" }
      responses:
        "200":
          description: The change that was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigChange" }
        "400":
          description: The scope is invalid, no reason was given, or the global value was targeted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such variable, or no override at that scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/config/changes:
    get:
      tags: [config]
      summary: The configuration audit log
      description: |
        Every change ever applied, by an admin or by ALG-09, newest first.
        Narrows by variable, scope and a result limit — an admin reviewing
        what moved a fee band needs to filter down to it, not scroll the
        whole history.
      parameters:
        - { name: key,   in: query, schema: { type: string }, example: pricing.delivery_base }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/ConfigScopeLevel" } }
        - { name: code,  in: query, schema: { type: string }, example: DHK-DHM }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Matching audit entries
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigChange" }
        "400":
          description: The scope is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The settings store is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/config/autotune:
    post:
      tags: [config]
      summary: Run ALG-09 for one area
      description: |
        Widens or narrows discovery.base_radius and dispatch.partner_radius
        for the given area, from a merchant-density and order-failure-rate
        signal (Appendix B, ALG-09). Every write goes through the same path
        an admin's own change takes, so bounds, pins and the audit log are
        enforced once. A pinned variable is reported skipped, not applied —
        the pass never fails because of one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoTuneRequest" }
      responses:
        "200":
          description: What the pass did with each tunable variable
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/TuneOutcome" }
        "400":
          description: The area is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The settings store is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/otp/request:
    post:
      tags: [auth]
      summary: Send a one-time code to a phone number
      description: |
        Public and rate-limited. The response reveals neither the code nor
        whether the number has an account — the second would let anyone
        enumerate which numbers are registered.

        `expires_in` and `resend_after` are the server's numbers; the client
        counts down with them rather than holding its own idea of the TTL (2.9).
      security: []
      parameters:
        - { name: area,     in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: division, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "01712345678"
                  description: |
                    A Bangladeshi mobile number. 01712345678, 8801712345678 and
                    +8801712345678 are all accepted and normalise to one
                    identity, so a caller cannot double a rate-limit allowance
                    by alternating format.
      responses:
        "200":
          description: A code has been sent
          content:
            application/json:
              schema:
                type: object
                required: [phone, expires_in, resend_after]
                properties:
                  phone:
                    type: string
                    example: "+88017*****678"
                    description: Masked, so the screen can confirm the number without showing it.
                  expires_in:   { type: integer, format: int64, example: 300 }
                  resend_after: { type: integer, format: int64, example: 720 }
                  demo_code:
                    type: string
                    example: "482913"
                    description: |
                      The code itself, present **only** in a demo deployment
                      (`DEMO_MODE=true`, which cannot be set in production).

                      A demo has no phone that will ring, so the code is
                      handed back for the screen to display. Every other
                      protection still applies: it is generated with the same
                      entropy, stored only as a hash, rate limited, locked out
                      after too many wrong attempts, and expires. A client
                      shows it when it is present and must not require it.
        "400":
          description: Not a valid Bangladeshi mobile number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: |
            Too many requests for this number (`otp_requests_exhausted`), or the
            number is locked out after too many wrong codes (`phone_locked_out`).
            A locked number gets no new code: issuing one would let an attacker
            clear their own way out of a lockout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: A code could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: Exchange a code for a session and a token pair
      security: []
      parameters:
        - { name: area,     in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: division, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, role]
              properties:
                phone: { type: string, example: "01712345678" }
                code:  { type: string, example: "123456", minLength: 6, maxLength: 6 }
                role:  { $ref: "#/components/schemas/Role" }
                device:
                  type: string
                  example: "Pixel 8"
                  description: Shown in the active-devices list so a user can recognise which to revoke.
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: The number, code format or role is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: |
            The code is wrong or has expired (`invalid_code`). The two are
            deliberately indistinguishable: telling them apart would tell an
            attacker whether a code is currently live. `details.attempts_remaining`
            says how many tries are left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many wrong codes; the number is locked out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The code could not be checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token and return a new pair
      description: |
        **This is the silent auto-login endpoint.** The app calls it on start
        and on any `401`; a valid refresh token means the user never sees a
        login screen.

        A refresh token works exactly once. Presenting one that has already been
        rotated away means a copy exists, so the entire session is revoked —
        including the honest client's current token. Which of the two holders is
        the thief cannot be known, and signing the real user out is recoverable
        where leaving an attacker signed in is not.

        Concurrent refreshes from one device produce one rotation, not a false
        theft alarm: the swap is a single atomic step. Clients should still
        coalesce concurrent refreshes into one in-flight request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: The body is malformed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: |
            `invalid_refresh_token` — unknown or expired; wipe stored
            credentials and show the login screen.
            `token_reuse_detected` — the token had already been rotated away.
            The whole session is now revoked; wipe storage and sign in again.
            `session_expired` — the session outlived its window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many refreshes for this token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      description: |
        Idempotent. The refresh token stops working immediately; the access
        token is stateless and stops working within its lifetime, which is why
        `auth.access_token_ttl` is capped at an hour.
      responses:
        "204":
          description: Signed out
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The session could not be revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session for this user
      description: |
        What someone reaches for when they think their account is compromised,
        so it does not require knowing which device was taken.
      responses:
        "204":
          description: Signed out everywhere
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The sessions could not be revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/sessions:
    get:
      tags: [auth]
      summary: List active devices
      description: |
        Carries no token and no hash: the list exists so a user can recognise
        and revoke a device, which needs a label and a time, not a credential.
      responses:
        "200":
          description: The user's active sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSession" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The devices could not be listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me:
    get:
      tags: [me]
      summary: The signed-in customer's profile
      description: |
        Always succeeds for a signed-in user. A customer who has never opened
        the profile screen gets an empty one rather than a 404 — otherwise every
        client would have to treat "signed in but no profile" as a special case,
        and some would treat it wrong.
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The profile could not be loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [me]
      summary: Update the profile
      description: |
        Only the fields present are changed. Omitting a field leaves it alone;
        sending it empty clears it. Without that distinction a client updating
        only the name would have to send the email back, and one that forgot
        would silently erase it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:     { type: string, maxLength: 80 }
                email:    { type: string }
                language: { type: string, enum: [bn, en] }
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400":
          description: A field is too long, malformed, or an unsupported language
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The profile could not be saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/addresses:
    get:
      tags: [me]
      summary: The customer's address book
      responses:
        "200":
          description: The addresses, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The addresses could not be loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [me]
      summary: Save a new address
      description: |
        The address is resolved to a service area before it is saved, and one
        that cannot be placed is refused. Config resolution, pricing and
        dispatch all key off the area, so an unplaced address is an order that
        reaches checkout and then cannot be priced.

        The first address a customer saves becomes their default whether they
        ask or not: a customer with one address and no default would be asked to
        choose between one option.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: The saved address, with its resolved area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          description: Missing details, an unset map pin, or a field too long
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The pin falls outside every service area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The address book is full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/addresses/{id}:
    put:
      tags: [me]
      summary: Replace an address
      description: |
        Re-resolved to a service area on every edit, not only when the pin
        moves. A customer correcting a street name has usually nudged the pin
        too, and an address whose stored area no longer matches its location
        prices the wrong zone — silently.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: The updated address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          description: Missing details or an unset map pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            No such address for this customer. Another customer's address is
            also a 404 — the caller learns nothing about whether it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [me]
      summary: Remove an address
      description: |
        If it was the default, the newest remaining address inherits, so a
        customer with addresses always has a default.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Removed
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such address for this customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/addresses/{id}/default:
    post:
      tags: [me]
      summary: Make an address the default
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The address, now the default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such address for this customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants:
    post:
      tags: [merchants]
      summary: Register a shop
      description: |
        D1: a shop may register from anywhere in Bangladesh. The only
        geographic requirement is that the pin falls inside a division we have
        mapped. The shop starts in `draft` and is invisible to customers until
        an admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDetailsInput" }
      responses:
        "201":
          description: The newly registered shop, in draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Details or pin not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The pin is outside the area we serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: This account already has a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/registration-requirements:
    get:
      tags: [merchants]
      summary: Which documents each kind of shop must supply
      description: |
        Served rather than hard-coded in the app, so the rule lives in one
        place. A pharmacy needs a drug licence; a grocery does not.
      responses:
        "200":
          description: The required documents, per shop type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationRequirements" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me:
    get:
      tags: [merchants]
      summary: The shop this account owns
      responses:
        "200":
          description: The shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [merchants]
      summary: Change the shop's details
      description: |
        Refused while the shop is under review, so an admin decides on the
        details they were shown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDetailsInput" }
      responses:
        "200":
          description: The updated shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Details or pin not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop is under review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [merchants]
      summary: Withdraw a registration that was never approved
      responses:
        "204":
          description: Withdrawn
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An approved shop cannot be withdrawn here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/documents:
    put:
      tags: [merchants]
      summary: Attach or replace a document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDocumentInput" }
      responses:
        "200":
          description: The shop, with the document attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: The document is not valid, or is not required for this kind of shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop is under review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/submit:
    post:
      tags: [merchants]
      summary: Submit the shop for review
      responses:
        "200":
          description: The shop, now pending review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Documents are still missing, or the shop cannot be submitted from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/hours:
    put:
      tags: [merchants]
      summary: Replace the opening hours
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantHoursInput" }
      responses:
        "200":
          description: The shop, with its new opening hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: The opening times overlap, are unreadable, or never open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/holiday:
    put:
      tags: [merchants]
      summary: Close the shop temporarily
      description: |
        Holiday mode hides the shop from listings until it reopens. A holiday
        with an end date expires on its own; one without stays until the owner
        ends it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantHolidayInput" }
      responses:
        "200":
          description: The shop, now on holiday
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: The reopening date is in the past or too far away
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [merchants]
      summary: Reopen after a holiday
      responses:
        "200":
          description: The shop, open again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants:
    get:
      tags: [admin]
      summary: List shops, for the approval queue
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/MerchantStatus" } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/MerchantType" } }
        - { name: division, in: query, required: false, schema: { type: string, example: BD-C } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Matching shops, newest first
          content:
            application/json:
              schema:
                type: object
                required: [merchants]
                properties:
                  merchants:
                    type: array
                    items: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Unknown status or shop type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}:
    get:
      tags: [admin]
      summary: One shop, documents included
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/history:
    get:
      tags: [admin]
      summary: Every decision taken on a shop, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The decision history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MerchantStatusEvent" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The history could not be read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a shop, making it visible to customers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, now approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be approved from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/reject:
    post:
      tags: [admin]
      summary: Refuse a shop, with a reason its owner will read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, now rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: No reason was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be rejected from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/suspend:
    post:
      tags: [admin]
      summary: Pull an approved shop out of the listings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, now suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: No reason was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be suspended from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/reinstate:
    post:
      tags: [admin]
      summary: Put a suspended shop back in the listings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, approved again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be reinstated from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/catalogue/capabilities:
    get:
      tags: [catalogue]
      summary: Which catalogue features this kind of shop has
      description: |
        Served rather than hard-coded in the merchant app, so the per-shop-type
        rules live in one place. A pharmacy has no add-ons; a restaurant has no
        unit of sale.
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What this shop's catalogue may contain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueCapabilities" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not your shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/catalogue/categories:
    get:
      tags: [catalogue]
      summary: List the sections of a shop's menu
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The sections, in the owner's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [catalogue]
      summary: Add a section to the menu
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: The new section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400":
          description: Details not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not your shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop, section or item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The menu has as many sections as we can keep
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/catalogue/categories/{categoryId}:
    put:
      tags: [catalogue]
      summary: Rename or reorder a section
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: categoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: The updated section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400":
          description: Details not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not your shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop, section or item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [catalogue]
      summary: Remove an empty section
      description: |
        Refused while items still point at it. Cascading would silently delete a
        shop's food; reassigning the items would be a decision the owner did not
        make.
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: categoryId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Removed
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not your shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The section still has items in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/catalogue/categories/{categoryId}/active:

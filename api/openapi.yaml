        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not your shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

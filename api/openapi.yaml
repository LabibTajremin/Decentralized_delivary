        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Matching shops, newest first
          content:
            application/json:
              schema:
                type: object
                required: [merchants]
                properties:
                  merchants:
                    type: array
                    items: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Unknown status or shop type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }


openapi: 3.1.0
info:
  title: Decentralized Delivery Platform API
  version: 0.1.0
  description: |
    Radius-scoped delivery marketplace for Bangladesh — food, grocery and pharmacy.

    Responses are display-ready: money arrives as both a minor-unit integer and a
    preformatted string, every breakdown line is precomputed, and any action the
    client may gate carries an explicit capability flag with a reason. The client
    performs no arithmetic and derives no permission
    (docs/build/05-architecture.md 2.9).
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: health
  - name: auth
  - name: config
    description: |
      Business rules an operator tunes at runtime — radius, fees, COD limits,
      dispatch bounds. Resolved per area (Appendix B) and never a deploy-time
      setting: a rule that needs a redeploy to change is a rule in the wrong
      place (ADR 0004).

      Every endpoint here requires the **admin** role, reads included: the
      effective configuration for an area states its COD limit, its fee bands
      and its discovery radius, which together describe how to price around the
      system.
  - name: me
    description: |
      The signed-in customer's own profile and address book. Every route acts
      on the caller's own data: the user id comes from the verified token, never
      from the request, because an endpoint that takes one from the client is an
      endpoint that will be asked for somebody else's home address.
  - name: geo
    description: |
      Administrative geography and spatial queries. Every distance in the system
      comes from here, so pricing, dispatch and the client all quote one number.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /v1/geo/resolve:
    get:
      tags: [geo]
      summary: Place a coordinate in the administrative hierarchy
      description: |
        Resolves a point to its area, district and division. Config resolution
        keys off this (area → district → division → global, Appendix B), so an
        address that cannot be placed cannot be priced or served.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double }, example: 23.7461 }
        - { name: lng, in: query, required: true, schema: { type: number, format: double }, example: 90.3742 }
      responses:
        "200":
          description: The point is inside the service area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "400":
          description: A parameter is missing or not a number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            The coordinate is valid but falls outside every division
            (`outside_service_area`). This is ordinary traffic from a place we
            do not cover yet, not a client fault — which is why it is not a 400.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/geo/merchants:
    get:
      tags: [geo]
      summary: Merchants within a radius, nearest first
      description: |
        Implements ALG-01. The division ceiling (D3) is part of the query, not a
        filter applied afterwards, so results can never cross a division
        boundary however large the radius.

        `distance_m` is the server's number. Clients render it and never
        recompute it: pricing bands off this same value, and two different
        distances for one journey is what 2.9 forbids.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - name: radius_m
          in: query
          required: true
          description: |
            Search radius in metres, 1 to 25000. This is a transport sanity
            bound only; the business radius for an area comes from the config
            module.
          schema: { type: number, format: double, minimum: 1, maximum: 25000 }
        - name: limit
          in: query
          description: Values above the maximum are clamped, not rejected.
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Results, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [merchants, count, radius_m]
                properties:
                  merchants:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyMerchant" }
                  count:    { type: integer }
                  radius_m: { type: number, format: double }
        "400":
          description: A parameter is missing, not a number, or out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/geo/distance:
    get:
      tags: [geo]
      summary: Great-circle distance between two points
      description: |
        The single source of distance for the whole system. Pricing and dispatch
        call this rather than computing their own, so every quoted fee and every
        assignment decision agrees.
      security: []
      parameters:
        - { name: from_lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: from_lng, in: query, required: true, schema: { type: number, format: double } }
        - { name: to_lat,   in: query, required: true, schema: { type: number, format: double } }
        - { name: to_lng,   in: query, required: true, schema: { type: number, format: double } }
      responses:
        "200":
          description: The distance in metres
          content:
            application/json:
              schema:
                type: object
                required: [distance_m]
                properties:
                  distance_m: { type: number, format: double, example: 190700 }
        "400":
          description: A parameter is missing or not a valid coordinate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/definitions:
    get:
      tags: [config]
      summary: Every configurable variable with its bounds
      description: |
        The admin UI reads this to build its editor. Bounds and the
        auto-tunable flag are included so an admin knows what is allowed before
        submitting rather than after being rejected.

        `discovery.division_ceiling` appears with `immutable: true`. It is
        listed so it is visible and auditable, not so it is adjustable — it
        enforces D3 and nothing may change it.
      responses:
        "200":
          description: The full variable registry
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigDefinition" }
        "503":
          description: The settings store is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/effective:
    get:
      tags: [config]
      summary: The settings in force for one place
      description: |
        Resolves every variable for a placement, applying overrides
        area → district → division → global. Each value reports the scope it
        came from, which is what an admin needs to understand why a value is
        what it is.
      parameters:
        - { name: area,     in: query, schema: { type: string }, example: DHK-DHM }
        - { name: district, in: query, schema: { type: string }, example: DHK }
        - { name: division, in: query, schema: { type: string }, example: DHA }
      responses:
        "200":
          description: Every variable, resolved
          content:
            application/json:
              schema:
                type: object
                required: [values]
                properties:
                  values:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveValue" }
        "503":
          description: The settings store is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/overrides:
    put:
      tags: [config]
      summary: Set a variable at one scope
      description: |
        Applies an override and records it in the audit log, atomically. A
        reason is required: a log that answers "what changed" but never "why"
        does not answer the question people actually ask.

        Values are sent as strings, not JSON numbers. Money is in minor units
        and must never round-trip through a float (2.9).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetConfigOverride" }
      responses:
        "200":
          description: The change that was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigChange" }
        "400":
          description: |
            The value is out of bounds, the wrong type, unreadable, or no
            reason was given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: |
            The variable is immutable (`immutable_config_key`), or the
            auto-tuner attempted a variable it may not change
            (`not_auto_tunable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such variable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An admin has pinned this variable against auto-tuning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/config/override:
    delete:
      tags: [config]
      summary: Reset a variable to the next scope up
      description: |
        Removes one override so the next level applies again, and records the
        removal. The global value is the fallback that makes resolution total
        and cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearConfigOverride" }
      responses:
        "200":
          description: The change that was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigChange" }
        "400":
          description: The scope is invalid, no reason was given, or the global value was targeted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such variable, or no override at that scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/otp/request:
    post:
      tags: [auth]
      summary: Send a one-time code to a phone number
      description: |
        Public and rate-limited. The response reveals neither the code nor
        whether the number has an account — the second would let anyone
        enumerate which numbers are registered.

        `expires_in` and `resend_after` are the server's numbers; the client
        counts down with them rather than holding its own idea of the TTL (2.9).
      security: []
      parameters:
        - { name: area,     in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: division, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "01712345678"
                  description: |
                    A Bangladeshi mobile number. 01712345678, 8801712345678 and
                    +8801712345678 are all accepted and normalise to one
                    identity, so a caller cannot double a rate-limit allowance
                    by alternating format.
      responses:
        "200":
          description: A code has been sent
          content:
            application/json:
              schema:
                type: object
                required: [phone, expires_in, resend_after]
                properties:
                  phone:
                    type: string
                    example: "+88017*****678"
                    description: Masked, so the screen can confirm the number without showing it.
                  expires_in:   { type: integer, format: int64, example: 300 }
                  resend_after: { type: integer, format: int64, example: 720 }
        "400":
          description: Not a valid Bangladeshi mobile number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: |
            Too many requests for this number (`otp_requests_exhausted`), or the
            number is locked out after too many wrong codes (`phone_locked_out`).
            A locked number gets no new code: issuing one would let an attacker
            clear their own way out of a lockout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: A code could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: Exchange a code for a session and a token pair
      security: []
      parameters:
        - { name: area,     in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: division, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, role]
              properties:
                phone: { type: string, example: "01712345678" }
                code:  { type: string, example: "123456", minLength: 6, maxLength: 6 }
                role:  { $ref: "#/components/schemas/Role" }
                device:
                  type: string
                  example: "Pixel 8"
                  description: Shown in the active-devices list so a user can recognise which to revoke.
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: The number, code format or role is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: |
            The code is wrong or has expired (`invalid_code`). The two are
            deliberately indistinguishable: telling them apart would tell an
            attacker whether a code is currently live. `details.attempts_remaining`
            says how many tries are left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many wrong codes; the number is locked out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The code could not be checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token and return a new pair
      description: |
        **This is the silent auto-login endpoint.** The app calls it on start
        and on any `401`; a valid refresh token means the user never sees a
        login screen.

        A refresh token works exactly once. Presenting one that has already been
        rotated away means a copy exists, so the entire session is revoked —
        including the honest client's current token. Which of the two holders is
        the thief cannot be known, and signing the real user out is recoverable
        where leaving an attacker signed in is not.

        Concurrent refreshes from one device produce one rotation, not a false
        theft alarm: the swap is a single atomic step. Clients should still
        coalesce concurrent refreshes into one in-flight request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: The body is malformed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: |
            `invalid_refresh_token` — unknown or expired; wipe stored
            credentials and show the login screen.
            `token_reuse_detected` — the token had already been rotated away.
            The whole session is now revoked; wipe storage and sign in again.
            `session_expired` — the session outlived its window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many refreshes for this token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      description: |
        Idempotent. The refresh token stops working immediately; the access
        token is stateless and stops working within its lifetime, which is why
        `auth.access_token_ttl` is capped at an hour.
      responses:
        "204":
          description: Signed out
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The session could not be revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session for this user
      description: |
        What someone reaches for when they think their account is compromised,
        so it does not require knowing which device was taken.
      responses:
        "204":
          description: Signed out everywhere
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The sessions could not be revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/auth/sessions:
    get:
      tags: [auth]
      summary: List active devices
      description: |
        Carries no token and no hash: the list exists so a user can recognise
        and revoke a device, which needs a label and a time, not a credential.
      responses:
        "200":
          description: The user's active sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSession" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The devices could not be listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me:
    get:
      tags: [me]
      summary: The signed-in customer's profile
      description: |
        Always succeeds for a signed-in user. A customer who has never opened
        the profile screen gets an empty one rather than a 404 — otherwise every
        client would have to treat "signed in but no profile" as a special case,
        and some would treat it wrong.
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The profile could not be loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [me]
      summary: Update the profile
      description: |
        Only the fields present are changed. Omitting a field leaves it alone;
        sending it empty clears it. Without that distinction a client updating
        only the name would have to send the email back, and one that forgot
        would silently erase it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:     { type: string, maxLength: 80 }
                email:    { type: string }
                language: { type: string, enum: [bn, en] }
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400":
          description: A field is too long, malformed, or an unsupported language
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The profile could not be saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/addresses:
    get:
      tags: [me]
      summary: The customer's address book
      responses:
        "200":
          description: The addresses, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The addresses could not be loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [me]
      summary: Save a new address
      description: |
        The address is resolved to a service area before it is saved, and one
        that cannot be placed is refused. Config resolution, pricing and
        dispatch all key off the area, so an unplaced address is an order that
        reaches checkout and then cannot be priced.

        The first address a customer saves becomes their default whether they
        ask or not: a customer with one address and no default would be asked to
        choose between one option.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: The saved address, with its resolved area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          description: Missing details, an unset map pin, or a field too long
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The pin falls outside every service area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The address book is full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/addresses/{id}:
    put:
      tags: [me]
      summary: Replace an address
      description: |
        Re-resolved to a service area on every edit, not only when the pin
        moves. A customer correcting a street name has usually nudged the pin
        too, and an address whose stored area no longer matches its location
        prices the wrong zone — silently.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: The updated address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400":
          description: Missing details or an unset map pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: |
            No such address for this customer. Another customer's address is
            also a 404 — the caller learns nothing about whether it exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [me]
      summary: Remove an address
      description: |
        If it was the default, the newest remaining address inherits, so a
        customer with addresses always has a default.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Removed
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such address for this customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/addresses/{id}/default:
    post:
      tags: [me]
      summary: Make an address the default
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The address, now the default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such address for this customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants:
    post:
      tags: [merchants]
      summary: Register a shop
      description: |
        D1: a shop may register from anywhere in Bangladesh. The only
        geographic requirement is that the pin falls inside a division we have
        mapped. The shop starts in `draft` and is invisible to customers until
        an admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDetailsInput" }
      responses:
        "201":
          description: The newly registered shop, in draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Details or pin not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The pin is outside the area we serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: This account already has a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/registration-requirements:
    get:
      tags: [merchants]
      summary: Which documents each kind of shop must supply
      description: |
        Served rather than hard-coded in the app, so the rule lives in one
        place. A pharmacy needs a drug licence; a grocery does not.
      responses:
        "200":
          description: The required documents, per shop type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationRequirements" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me:
    get:
      tags: [merchants]
      summary: The shop this account owns
      responses:
        "200":
          description: The shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [merchants]
      summary: Change the shop's details
      description: |
        Refused while the shop is under review, so an admin decides on the
        details they were shown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDetailsInput" }
      responses:
        "200":
          description: The updated shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Details or pin not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop is under review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [merchants]
      summary: Withdraw a registration that was never approved
      responses:
        "204":
          description: Withdrawn
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An approved shop cannot be withdrawn here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/documents:
    put:
      tags: [merchants]
      summary: Attach or replace a document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDocumentInput" }
      responses:
        "200":
          description: The shop, with the document attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: The document is not valid, or is not required for this kind of shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop is under review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/submit:
    post:
      tags: [merchants]
      summary: Submit the shop for review
      responses:
        "200":
          description: The shop, now pending review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Documents are still missing, or the shop cannot be submitted from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/hours:
    put:
      tags: [merchants]
      summary: Replace the opening hours
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantHoursInput" }
      responses:
        "200":
          description: The shop, with its new opening hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: The opening times overlap, are unreadable, or never open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/me/holiday:
    put:
      tags: [merchants]
      summary: Close the shop temporarily
      description: |
        Holiday mode hides the shop from listings until it reopens. A holiday
        with an end date expires on its own; one without stays until the owner
        ends it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantHolidayInput" }
      responses:
        "200":
          description: The shop, now on holiday
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: The reopening date is in the past or too far away
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [merchants]
      summary: Reopen after a holiday
      responses:
        "200":
          description: The shop, open again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: This account has not registered a shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants:
    get:
      tags: [admin]
      summary: List shops, for the approval queue
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/MerchantStatus" } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/MerchantType" } }
        - { name: division, in: query, required: false, schema: { type: string, example: BD-C } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Matching shops, newest first
          content:
            application/json:
              schema:
                type: object
                required: [merchants]
                properties:
                  merchants:
                    type: array
                    items: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: Unknown status or shop type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}:
    get:
      tags: [admin]
      summary: One shop, documents included
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/history:
    get:
      tags: [admin]
      summary: Every decision taken on a shop, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The decision history
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MerchantStatusEvent" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The history could not be read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a shop, making it visible to customers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, now approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be approved from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/reject:
    post:
      tags: [admin]
      summary: Refuse a shop, with a reason its owner will read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, now rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: No reason was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be rejected from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/suspend:
    post:
      tags: [admin]
      summary: Pull an approved shop out of the listings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, now suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400":
          description: No reason was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be suspended from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/reinstate:
    post:
      tags: [admin]
      summary: Put a suspended shop back in the listings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantDecisionInput" }
      responses:
        "200":
          description: The shop, approved again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The shop cannot be reinstated from its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. See docs/build/phases/P04.md.

  schemas:
    MerchantType:
      type: string
      enum: [restaurant, grocery, pharmacy]

    MerchantStatus:
      type: string
      description: |
        Where a shop sits in the approval workflow. Only `approved` is visible
        to customers, and only then when it is not on holiday.
      enum: [draft, pending_review, approved, rejected, suspended]

    MerchantDocumentKind:
      type: string
      enum: [trade_licence, national_id, food_licence, drug_licence]

    MerchantDetailsInput:
      type: object
      required: [name, type, phone, line1, lat, lng]
      properties:
        name:     { type: string, example: "নূরজাহান হোটেল" }
        type:     { $ref: "#/components/schemas/MerchantType" }
        phone:    { type: string, example: "01712345678" }
        email:    { type: string, example: "shop@example.com" }
        logo_url: { type: string, example: "/static/demo/merchant-logo-01.png" }
        line1:    { type: string, example: "১২/এ, মিরপুর রোড" }
        line2:    { type: string }
        lat:      { type: number, format: double, example: 23.7509 }
        lng:      { type: number, format: double, example: 90.3925 }

    MerchantDocumentInput:
      type: object
      required: [kind, number, file_url]
      properties:
        kind:     { $ref: "#/components/schemas/MerchantDocumentKind" }
        number:   { type: string, example: "TRAD/DNCC/012345" }
        file_url: { type: string, example: "/static/demo/document-01.png" }

    MerchantHoursInput:
      type: object
      required: [days]
      description: |
        Opening hours keyed by weekday number, Sunday as `"0"`, each window
        written `HH:MM-HH:MM` in Bangladesh local time. A day left out is
        closed. Windows may not overlap and may not wrap past midnight: a shop
        trading until 2am enters `22:00-24:00` and `00:00-02:00` on the next
        day.
      properties:
        days:
          type: object
          additionalProperties:
            type: array
            items: { type: string, example: "09:00-22:00" }

    MerchantHolidayInput:
      type: object
      properties:
        until:
          type: string
          format: date-time
          description: When the shop reopens. Omit for indefinitely.
        reason: { type: string, example: "ঈদের ছুটি" }

    MerchantDecisionInput:
      type: object
      description: |
        The note an admin attaches to a decision. Required for a rejection or a
        suspension, because the owner reads it; optional for an approval.
      properties:
        note: { type: string }

    MerchantDocument:
      type: object
      required: [kind, number, file_url, uploaded_at]
      properties:
        kind:        { $ref: "#/components/schemas/MerchantDocumentKind" }
        number:      { type: string }
        file_url:    { type: string }
        uploaded_at: { type: string, format: date-time }

    MerchantStatusEvent:
      type: object
      required: [id, from, to, actor_user_id, at]
      properties:
        id:            { type: string }
        from:          { $ref: "#/components/schemas/MerchantStatus" }
        to:            { $ref: "#/components/schemas/MerchantStatus" }
        actor_user_id: { type: string }
        note:          { type: string }
        at:            { type: string, format: date-time }

    RegistrationRequirements:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            type: object
            required: [type, required_documents]
            properties:
              type: { $ref: "#/components/schemas/MerchantType" }
              required_documents:
                type: array
                items: { $ref: "#/components/schemas/MerchantDocumentKind" }

    Merchant:
      type: object
      description: |
        A shop, as its owner and an admin see it. `open_status` is composed by
        the server and rendered verbatim by the client (2.9); the client never
        decides for itself whether a shop is open from the hours.
      required:
        [id, owner_user_id, name, type, status, phone, line1, single_line,
         lat, lng, area_code, area_name, district_code, division_code,
         is_listed, is_open_now, open_status, hours, documents,
         required_documents, missing_documents, can_submit, next_statuses,
         created_at]
      properties:
        id:            { type: string, example: mch_01J8ZQ8F3K7YQ2N4V5W6X7Y8Z9 }
        owner_user_id: { type: string }
        name:          { type: string }
        type:          { $ref: "#/components/schemas/MerchantType" }
        status:        { $ref: "#/components/schemas/MerchantStatus" }
        phone:         { type: string, example: "+8801712345678" }
        email:         { type: string }
        logo_url:      { type: string }
        line1:         { type: string }
        line2:         { type: string }
        single_line:   { type: string, description: The whole address as one line, composed by the server }
        lat:           { type: number, format: double }
        lng:           { type: number, format: double }
        area_code:     { type: string }
        area_name:     { type: string }
        district_code: { type: string }
        division_code: { type: string, description: The D3 ceiling — a customer outside this division can never see the shop }
        is_listed:     { type: boolean, description: Approved and not on holiday }
        is_open_now:   { type: boolean, description: Listed and inside an opening window }
        open_status:   { type: string, example: "খোলা আছে — বন্ধ হবে 22:00" }
        hours:
          type: object
          additionalProperties:
            type: array
            items: { type: string, example: "09:00-22:00" }
        holiday:
          type: object
          properties:
            until:  { type: string, format: date-time }
            reason: { type: string }
        documents:
          type: array
          items: { $ref: "#/components/schemas/MerchantDocument" }
        required_documents:
          type: array
          items: { $ref: "#/components/schemas/MerchantDocumentKind" }
        missing_documents:
          type: array
          items: { $ref: "#/components/schemas/MerchantDocumentKind" }
        can_submit:    { type: boolean, description: Whether the owner may submit for review right now }
        next_statuses:
          type: array
          items: { $ref: "#/components/schemas/MerchantStatus" }
        review_note:   { type: string, description: Why the shop was rejected or suspended }
        created_at:    { type: string, format: date-time }

    Money:
      type: object
      description: |
        Money is always transported as both a minor-unit integer and a
        preformatted display string. The client renders `display` and never
        computes with `minor`.
      required: [minor, currency, display]
      properties:
        minor:    { type: integer, format: int64, example: 124000 }
        currency: { type: string, example: BDT }
        display:  { type: string, example: "৳ 1,240" }

    Capability:
      type: object
      description: |
        Whether the user may take an action, decided by the server. When
        `allowed` is false, `reason` is human-readable and safe to show.
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason:  { type: string, example: "Minimum order for this zone is ৳ 250" }

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, example: invalid_refresh_token }
        message: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
          description: |
            Structured context, such as which parameter was rejected. Never
            present on a 500: an internal error's own message may name a table
            or a host, so it is replaced with a generic one before it leaves
            the process.

    ErrorResponse:
      type: object
      description: |
        Every failure uses this envelope, so a client can branch on the body
        shape alone without inspecting the status code first.
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    Profile:
      type: object
      required: [user_id, name, display_name, language]
      properties:
        user_id: { type: string }
        name:
          type: string
          description: May be empty. A customer can order without giving one.
        display_name:
          type: string
          description: |
            Never empty. The server decides the fallback so two clients do not
            invent two different greetings for the same nameless customer.
        email:    { type: string }
        language: { type: string, enum: [bn, en] }

    AddressInput:
      type: object
      required: [recipient_name, recipient_phone, line1, lat, lng]
      properties:
        label: { type: string, maxLength: 40, example: Home }
        recipient_name:
          type: string
          maxLength: 80
          description: |
            May differ from the account holder: people send food to their
            parents, and the rider needs whoever will open the door.
        recipient_phone: { type: string, example: "01712345678" }
        line1:           { type: string, maxLength: 200 }
        line2:           { type: string, maxLength: 200 }
        instructions:    { type: string, maxLength: 300, example: "Third floor, blue gate" }
        lat:
          type: number
          format: double
          description: |
            Where the rider goes. (0, 0) is refused: it is in the Gulf of
            Guinea and is almost always an unset variable rather than a place
            someone lives.
        lng:          { type: number, format: double }
        make_default: { type: boolean }

    Address:
      type: object
      required: [id, label, recipient_name, recipient_phone, line1, single_line, lat, lng, area_code, district_code, division_code, is_default]
      properties:
        id:              { type: string }
        label:           { type: string }
        recipient_name:  { type: string }
        recipient_phone: { type: string }
        line1:           { type: string }
        line2:           { type: string }
        instructions:    { type: string }
        single_line:
          type: string
          description: |
            Composed by the server. Every surface that shows an address — the
            app, a receipt, the rider's screen — shows this same string, because
            a client that joins the parts itself will eventually join them
            differently (2.9).
        lat:           { type: number, format: double }
        lng:           { type: number, format: double }
        area_code:     { type: string, example: DHK-DHM }
        area_name:     { type: string, example: Dhanmondi }
        district_code: { type: string, example: DHK }
        division_code: { $ref: "#/components/schemas/Area/properties/division_code" }
        is_default:    { type: boolean }

    Role:
      type: string
      enum: [customer, partner, merchant, admin]
      description: |
        The four roles. Every endpoint declares which it admits; admin is not a
        silent superset, so an admin token reaching a partner endpoint is
        refused rather than quietly allowed (2.7).

    TokenPair:
      type: object
      description: |
        What a client stores after signing in or refreshing. The refresh token
        goes to secure storage (Keystore / Keychain); the access token stays in
        memory and is never written to disk.
      required: [access_token, refresh_token, token_type, expires_in, role, user_id, session_id]
      properties:
        access_token:
          type: string
          description: |
            A short-lived JWT. Clients do not decode it: deciding when a token
            is valid is a business rule, and a client that decides for itself
            is a client that disagrees with the server (2.9).
        refresh_token:
          type: string
          description: |
            Opaque and single-use. The server stores only a SHA-256 hash, so a
            dump of the session store cannot be used to sign in as anyone.
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          format: int64
          example: 900
          description: Seconds until the access token expires, stated by the server.
        role:       { $ref: "#/components/schemas/Role" }
        user_id:    { type: string }
        session_id: { type: string }
        new_user:
          type: boolean
          description: |
            True only on a first sign-in, so the app knows to collect a name
            rather than inferring it from an empty profile. Absent on a refresh.

    DeviceSession:
      type: object
      required: [session_id, device, created_at, last_seen_at, current]
      properties:
        session_id:   { type: string }
        device:       { type: string, example: "Pixel 8" }
        created_at:   { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Marks the session making this request, so the UI can label it.

    ConfigScopeLevel:
      type: string
      enum: [area, district, division, global]
      description: |
        How specific a setting is. Resolution goes area → district → division →
        global and the first match wins (Appendix B).

    ConfigValueType:
      type: string
      enum: [count, bool, ratio, money_minor, distance_m, duration_s]
      description: |
        Money, distance and duration are separate types rather than all being
        "a number", because the unit is the part people get wrong. Money is
        always minor units; distance is always metres.

    ConfigDefinition:
      type: object
      required: [key, type, default, auto_tunable, immutable, purpose]
      properties:
        key:          { type: string, example: pricing.delivery_base }
        type:         { $ref: "#/components/schemas/ConfigValueType" }
        unit:         { type: string, example: BDT }
        default:      { type: string, example: "4000" }
        minimum:      { type: string, description: Absent for booleans, which have no order. }
        maximum:      { type: string }
        auto_tunable: { type: boolean, description: Whether ALG-09 may adjust it. }
        immutable:
          type: boolean
          description: |
            True only for discovery.division_ceiling. Nothing may change it —
            not an admin, not the tuner, not a direct database write.
        purpose:      { type: string }

    EffectiveValue:
      type: object
      required: [key, type, value, source]
      properties:
        key:    { type: string }
        type:   { $ref: "#/components/schemas/ConfigValueType" }
        value:  { type: string, description: Canonical text form; parse according to `type`. }
        source:
          type: string
          example: "area:DHK-DHM"
          description: The scope this value came from, or "global".

    SetConfigOverride:
      type: object
      required: [key, level, value, reason]
      properties:
        key:   { type: string, example: pricing.delivery_base }
        level: { $ref: "#/components/schemas/ConfigScopeLevel" }
        code:  { type: string, description: The area, district or division code. Must be empty for global. }
        value: { type: string, example: "6000" }
        pinned:
          type: boolean
          description: Stop the auto-tuner changing this variable in this scope.
        reason:   { type: string, example: "Dhanmondi traffic has got worse" }
        actor_id: { type: string, description: The admin making the change. }

    ClearConfigOverride:
      type: object
      required: [key, level, reason]
      properties:
        key:      { type: string }
        level:    { $ref: "#/components/schemas/ConfigScopeLevel" }
        code:     { type: string }
        reason:   { type: string }
        actor_id: { type: string }

    ConfigChange:
      type: object
      description: One entry in the configuration audit log (D5).
      required: [id, key, scope, old_value, new_value, actor, reason, changed_at]
      properties:
        id:        { type: string }
        key:       { type: string }
        scope:     { type: string, example: "area:DHK-DHM" }
        old_value: { type: string }
        new_value: { type: string }
        actor:     { type: string, example: "admin:adm_1" }
        reason:    { type: string }
        changed_at: { type: string, format: date-time }

    Area:
      type: object
      description: The administrative placement of a coordinate.
      required: [area_code, area_name, district_code, division_code, division_name]
      properties:
        area_code:     { type: string, example: DHK-DHM }
        area_name:     { type: string, example: Dhanmondi }
        district_code: { type: string, example: DHK }
        division_code:
          type: string
          enum: [DHA, CTG, KHU, RAJ, BAR, SYL, RAN, MYM]
          description: |
            One of Bangladesh's eight divisions. This is the hard geographic
            boundary of the system: radius expansion can never cross it (D3),
            and no admin setting can disable that.
        division_name: { type: string, example: Dhaka }

    NearbyMerchant:
      type: object
      required: [merchant_id, lat, lng, distance_m]
      properties:
        merchant_id: { type: string, example: MER-DEMO-0001 }
        lat:         { type: number, format: double }
        lng:         { type: number, format: double }
        distance_m:
          type: number
          format: double
          description: |
            Straight-line distance from the search centre, computed by the
            server. The client displays it and never recalculates it.

security:
  - bearerAuth: []

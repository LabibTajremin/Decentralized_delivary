      tags: [catalogue]
      summary: List a shop's items, as its owner sees them
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: active, in: query, required: false, schema: { type: boolean } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Matches the item name }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The items, in the owner's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "400":
          description: That page is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [catalogue]
      summary: Add an item to the menu
      description: |
        Which fields are allowed is decided by the shop's type. A grocery item
        must state a unit of sale; only a pharmacy item may require a
        prescription; add-ons are for restaurants. Sending a field this kind of
        shop does not have is refused rather than silently dropped.
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }

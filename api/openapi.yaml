        "200":
          description: The updated items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemList" }
        "400":
          description: Details not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not your shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":

        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/merchants/{id}/history:
    get:
      tags: [admin]
      summary: Every decision taken on a shop, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: The decision history
          content:
            application/json:
              schema:
                type: object
                required: [events]

  /v1/discovery/merchants:
    get:
      tags: [discovery]
      summary: Shops a customer can order from, here
      description: |
        D1, D2 and D3 in one call. The server resolves the delivery point to a
        division, reads the radius ladder configured for that place, searches
        nearest-first inside the division boundary, and returns both the shops
        and the whole expansion decision — whether a wider search exists,
        whether it should be offered, and what it would cost.

        Nothing here is left for the client to work out. The distance, the
        delivery fee and the notice above the list are all composed by the
        server (05-architecture.md 2.9), and `expansion.offered` is the answer
        to "should I show the widen button", not an input to it.
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - name: level
          in: query
          required: false
          description: |
            Expansion level to search at, 0 being the base radius. Clamped to
            the configured ladder rather than refused: the client is holding a
            number this server gave it, and configuration may have narrowed the
            ladder since.
          schema: { type: integer, minimum: 0, default: 0 }
        - { name: type, in: query, required: false, schema: { type: string, enum: [restaurant, grocery, pharmacy] } }
        - { name: q, in: query, required: false, description: Filters by shop name., schema: { type: string } }
        - { name: lang, in: query, required: false, description: "`en` for English; anything else is Bengali.", schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: What is in range, and what widening would do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySearch" }
        "400":
          description: The delivery point or a filter is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The delivery point falls outside every division we serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The search could not be run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/discovery/merchants/{merchantId}:
    get:
      tags: [discovery]
      summary: Whether one shop is reachable from a delivery point
      description: |
        The single-merchant form of the search, for a cart whose delivery
        address has changed. A shop across a division boundary is unreachable
        at every expansion level (D3), which is a different answer from "too
        far for now" and is reported as such.
      security: []
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The reachability answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryReach" }
        "400":
          description: The delivery point is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such shop, or a point outside every division we serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The check could not be run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cart:
    get:
      tags: [cart]
      summary: The caller's cart, revalidated against the shop as it stands
      description: |
        A cart is never returned from storage as-is. Every read re-asks the shop
        whether it is open and listed, re-asks the menu what each line costs and
        whether it is still orderable, and re-asks discovery whether the
        delivery address can still be reached from that shop (D3).

        What changed is *reported*, not fixed. A line whose price moved stays in
        the cart, marked, at the new price — a cart that silently repriced
        itself would show one number on the list and charge another at checkout.

        A customer with no cart gets `200` with an empty body rather than a
        `404`, because an empty cart and no cart are the same screen.
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The cart could not be read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [cart]
      summary: Empty the cart
      responses:
        "204":
          description: Emptied
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The cart could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cart/items:
    post:
      tags: [cart]
      summary: Add an item or a bundle to the cart
      description: |
        The request carries ids only. The name, the price and whether the chosen
        combination is even allowed are read from the catalogue by the server —
        a request that carried a price would be a request that could carry a
        different one (2.9).

        Adding from a second shop is **refused**, not resolved: emptying
        somebody's cart is a destructive act and it is theirs to take. Use
        `/v1/cart/replace` to take it deliberately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartAddRequest" }
      responses:
        "200":
          description: The cart after adding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: The request, the quantity or the chosen options are not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such item or bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The cart belongs to another shop, or the item is not orderable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cart/replace:
    post:
      tags: [cart]
      summary: Empty the cart and start a new one at another shop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartAddRequest" }
      responses:
        "200":
          description: The new cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: The request is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such item or bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cart/lines/{lineId}:
    put:
      tags: [cart]
      summary: Change how many of a line
      description: A quantity of zero removes the line, which is what tapping minus down to nothing means.
      parameters:
        - { name: lineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 20 }
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: The quantity is out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No cart, or no such line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [cart]
      summary: Take a line out of the cart
      parameters:
        - { name: lineId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The cart after the removal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No cart, or no such line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cart/address:
    put:
      tags: [cart]
      summary: Bind the cart to a delivery address
      description: |
        The operation that makes a cart invalidate. The next read re-asks
        discovery, so a customer who moves their delivery address into another
        division is told while the cart is still small rather than at checkout
        — and D3 makes that answer permanent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, lat, lng]
              properties:
                address_id: { type: string }
                lat: { type: number, format: double }
                lng: { type: number, format: double }
      responses:
        "200":
          description: The cart, revalidated against the new address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: The address is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/orders:
    post:
      tags: [orders]
      summary: Place an order from the caller's cart
      description: |
        The request carries an address id, a way to pay, and nothing else.
        What the goods cost, how far it is, whether the shop is open and
        whether cash is allowed at this amount are all read by the server at
        the moment it writes the order — a price the customer was shown is not
        a price the system promised (2.9).

        **Idempotency.** Send `Idempotency-Key` (or `idempotency_key` in the
        body). A second request with the same key returns the first order
        rather than making another one, which is what a customer on a village
        2G connection tapping "Place order" twice actually needs.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
        - { name: lang, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, payment_method]
              properties:
                address_id: { type: string }
                payment_method:
                  type: string
                  enum: [cash, online]
                  description: |
                    `cash` places the order outright. `online` starts it at
                    `pending_payment` — a shop that started cooking on an unpaid
                    order would be carrying the platform's risk.
                idempotency_key: { type: string }
      responses:
        "201":
          description: The order, placed — or the one an earlier identical request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: The request, the address or the payment method is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            The cart cannot be ordered, the shop is not taking orders, the
            address is not deliverable from this shop (D3), or a cash order
            exceeds the area's COD limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The order could not be written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [orders]
      summary: The caller's own orders, newest first
      parameters:
        - { name: live, in: query, required: false, description: "`true` for the current-orders tab.", schema: { type: string, enum: ["true"] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The orders could not be read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/orders/{orderId}:
    get:
      tags: [orders]
      summary: One of the caller's own orders
      description: |
        An order that is not the caller's answers `404`, not `403`. Saying "that
        order exists but is not yours" would let anybody with a list of ids find
        out which ones are real.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such order of the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/orders/{orderId}/cancellation:
    get:
      tags: [orders]
      summary: Whether the order can still be cancelled, and for how long
      description: |
        Its own endpoint because a countdown needs refreshing and a client must
        not learn the answer by trying it. `seconds_left` comes from the
        server's clock, which is the one that decides.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The cancellation decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderCancellation" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such order of the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/orders/{orderId}/cancel:
    post:
      tags: [orders]
      summary: Cancel an order within the free window
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such order of the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            The window has closed, the shop has started preparing, or the order
            has already finished. `error.details.reason` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/orders:
    get:
      tags: [orders]
      summary: A shop's order queue
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: live, in: query, required: false, schema: { type: string, enum: ["true"] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of the shop's orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not a shop the caller owns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/orders/{orderId}:
    get:
      tags: [orders]
      summary: One order from a shop's queue
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not a shop the caller owns, or no such order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/orders/{orderId}/accept:
    post:
      tags: [orders]
      summary: The shop accepts an order
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The order, accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not a shop the caller owns, or no such order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The order cannot move that way from where it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/orders/{orderId}/reject:
    post:
      tags: [orders]
      summary: The shop cannot take an order
      description: A reason is required — it is the only thing the customer will have to go on.
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The order, rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: No reason was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not a shop the caller owns, or no such order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The order cannot move that way from where it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/orders/{orderId}/preparing:
    post:
      tags: [orders]
      summary: The shop has started preparing
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not a shop the caller owns, or no such order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The order cannot move that way from where it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/merchants/{merchantId}/orders/{orderId}/ready:
    post:
      tags: [orders]
      summary: The order is ready for a rider
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not a shop the caller owns, or no such order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The order cannot move that way from where it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/orders/{orderId}/transition:
    post:
      tags: [orders]
      summary: Move an order as an admin
      description: |
        The transition is still checked against the state machine. This is a way
        in for operations, not a way round it.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
                reason: { type: string }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: That is not a state an order can be in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The order cannot move that way from where it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner:
    post:
      tags: [partner]
      summary: Sign up to carry orders
      description: |
        D1 from the partner's side: a delivery partner may provide delivery
        anywhere in Bangladesh, so there is no area to register in and nothing
        to approve against a map. Where they can work is decided every time
        they report a location.

        Registering twice is not an error; it is somebody tapping a button
        again, and they get the partner they already are.
      parameters:
        - { name: lang, in: query, required: false, description: "`en` for English; anything else is Bengali.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                vehicle:
                  type: string
                  description: Free text — "bicycle", "motorcycle", "van". Not an enum, because the list would be wrong within a month.
      responses:
        "201":
          description: The partner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartner" }
        "400":
          description: The name or phone number is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [partner]
      summary: The caller's own partner record
      parameters:
        - { name: lang, in: query, required: false, description: "`en` for English; anything else is Bengali.", schema: { type: string } }
      responses:
        "200":
          description: The partner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartner" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/availability:
    put:
      tags: [partner]
      summary: Go on or off shift
      description: |
        `busy` is not something a partner declares: it is what being at the
        concurrent limit is called, and it resolves itself when they finish a
        delivery. Letting somebody set it by hand would give them a way to stay
        in the pool while refusing every offer.
      parameters:
        - { name: lang, in: query, required: false, description: "`en` for English; anything else is Bengali.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { type: string, enum: [offline, available] }
      responses:
        "200":
          description: The partner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartner" }
        "400":
          description: That is not an availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/preference:
    put:
      tags: [partner]
      summary: Choose long-distance, short-distance, or both (D4)
      parameters:
        - { name: lang, in: query, required: false, description: "`en` for English; anything else is Bengali.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preference]
              properties:
                preference: { type: string, enum: [short, long, any] }
      responses:
        "200":
          description: The partner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartner" }
        "400":
          description: That is not a distance choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/location:
    put:
      tags: [partner]
      summary: Report where the partner is
      description: |
        Called often, as a rider moves. It writes one row and nothing else: the
        feed is computed on read rather than pushed on write, because a partner
        who is driving is not looking at their phone.
      parameters:
        - { name: lang, in: query, required: false, description: "`en` for English; anything else is Bengali.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
      responses:
        "200":
          description: The partner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartner" }
        "400":
          description: The location is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/feed:
    get:
      tags: [partner]
      summary: The deliveries this partner should see (ALG-08)
      description: |
        Bounded, nearest-pickup first, and filtered by the partner's own
        distance choice (D4). A client that filtered a global list by its own
        radius would be deciding visibility, which 2.9 forbids, and would need a
        copy of `dispatch.partner_radius` to do it.

        An empty list carries a `reason`: `offline`, `at_capacity` or
        `nothing_nearby`. A partner who forgot to go online should be told that,
        not shown nothing and left to wonder.
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerFeed" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/jobs:
    get:
      tags: [partner]
      summary: The partner's own deliveries
      parameters:
        - { name: live, in: query, required: false, description: "`true` for what they are carrying now.", schema: { type: string, enum: ["true"] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryJobList" }
        "400":
          description: The paging is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/jobs/{jobId}/accept:
    post:
      tags: [partner]
      summary: Take the delivery that was offered
      description: |
        Two partners cannot be assigned the same order. The domain refuses a
        partner moving a job they do not hold; the repository refuses the write
        when the job has moved since it was read. The second rider gets a `409`.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryJob" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such delivery, or not a partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Somebody else has taken it, or the offer expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/jobs/{jobId}/decline:
    post:
      tags: [partner]
      summary: Pass on the delivery that was offered
      description: It goes back on the board, and counts against the partner's acceptance rate.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryJob" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such delivery, or not a partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: It is no longer offered to this partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/jobs/{jobId}/collect:
    post:
      tags: [partner]
      summary: The rider has the goods
      description: Moves the order to `picked_up` as well, through OrderContract.Advance.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryJob" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such delivery, or not a partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The delivery cannot move that way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/jobs/{jobId}/deliver:
    post:
      tags: [partner]
      summary: The rider has handed them over
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryJob" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such delivery, or not a partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The delivery cannot move that way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/jobs/{jobId}/fail:
    post:
      tags: [partner]
      summary: The delivery could not be completed
      description: |
        A reason is required. A rider abandoning a delivery owes the customer
        and the shop an explanation — it is the only thing either of them will
        have to go on.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryJob" }
        "400":
          description: No reason was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such delivery, or not a partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The delivery cannot move that way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/dispatch/sweep:
    post:
      tags: [partner]
      summary: Run the dispatch heartbeat
      description: |
        Two passes: expire the offers nobody answered, then offer the jobs
        sitting on the board to somebody. Both are needed — without the first a
        job stalls behind a rider who put their phone away, and without the
        second a declined job would wait forever.

        An endpoint rather than a background goroutine, so the sweep runs where
        somebody can see it: an operator can trigger it, a cron can call it, and
        it is safe to run twice. A goroutine inside the API would run once per
        replica and be invisible when it stopped.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: What the sweep did
          content:
            application/json:
              schema:
                type: object
                required: [expired, offered]
                properties:
                  expired: { type: integer, description: Offers nobody answered, now back on the board }
                  offered: { type: integer, description: Waiting jobs put to a partner this pass }
        "400":
          description: The limit is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The sweep could not run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/payments/checkout:
    post:
      tags: [payments]
      summary: Start, or resume, paying for an order online
      description: |
        Idempotent on the order id, the same sense as everywhere else a
        customer might tap twice on a slow connection: a checkout already in
        progress for this order is returned again rather than started a
        second time. A previous attempt that already failed does not block a
        new one — that is what a retry is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: string }
      responses:
        "200":
          description: The checkout, new or resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
        "400":
          description: The request is malformed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such order, or it is not the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: That order is not cash-free and waiting for payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The gateway or payment storage could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/payments/{orderId}:
    get:
      tags: [payments]
      summary: The caller's own payment for an order
      description: |
        What a customer's app polls after a checkout redirect, to learn
        whether the gateway has answered yet.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such payment, or it is not the caller's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/payments/manual/webhook:
    post:
      tags: [payments]
      summary: Receive a gateway callback
      description: |
        Reached by a payment gateway's own servers, never by a person — there
        is no account to hold a bearer token, so this is authenticated by the
        payload's own signature (`X-Webhook-Signature`) instead.

        Idempotent by construction: a gateway's retry policy guarantees
        at-least-once delivery, never exactly-once, and a payment leaves
        `pending` exactly once no matter how many times the same event
        arrives. A replay after the first success is answered the same way
        the first one was, with nothing written twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, gateway_ref, succeeded, amount_minor]
              properties:
                reference:     { type: string, description: The merchant reference this module minted at checkout }
                gateway_ref:   { type: string, description: The gateway's own transaction id }
                succeeded:     { type: boolean }
                reason:        { type: string, description: Required when succeeded is false }
                amount_minor:  { type: integer, format: int64, description: What the gateway confirms it collected }
      responses:
        "204":
          description: Applied
        "400":
          description: The webhook could not be verified or decoded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: That reference does not match a payment this module started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The confirmed amount does not match what was asked for
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/payments/manual/complete:
    post:
      tags: [payments]
      summary: Complete a manual-gateway payment without a bank
      description: |
        **Not mounted in production.** The manual gateway never moves money,
        so outside production this stands in for the moment a bank would
        confirm: it builds the same event a signed callback carries and feeds
        it through the same path, so the idempotency and the state machine are
        exercised for real.

        A client learns whether this route exists from `demo_completion` on
        the checkout it is completing. It must not call it otherwise — in
        production the route is absent and the call 404s.

        `WebhookUseCase.Simulate` checks the gateway's name again before doing
        anything, so leaving this mounted by mistake still cannot mark an
        order paid against a real gateway. It also checks that the payment is
        the caller's own: a payment id belonging to somebody else answers
        `404`, the same as one that never existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, succeeded]
              properties:
                payment_id: { type: string }
                succeeded:  { type: boolean }
                reason:     { type: string, description: Required when succeeded is false }
      responses:
        "204":
          description: Applied
        "400":
          description: The request is malformed, or a failure carries no reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The configured gateway is not the manual stand-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such payment, or it is not the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/partner/cod:
    get:
      tags: [payments]
      summary: The caller's own cash-on-delivery ledger
      description: |
        What a rider is carrying: the total still owed for delivered cash
        orders, the total already handed over, and the collections behind
        each figure.
      responses:
        "200":
          description: The ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ledger" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not registered as a delivery partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/payments/{orderId}:
    get:
      tags: [payments]
      summary: Any order's payment
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/payments/{orderId}/refund:
    post:
      tags: [payments]
      summary: Give a captured payment back
      description: |
        Idempotent: refunding an already-refunded payment succeeds without
        asking the gateway a second time. The primitive P16's refund
        workflow calls through PaymentContract; this route is the same
        operation for an operator working a case by hand.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The payment, now refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          description: A reason is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Only a captured payment can be refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The gateway or payment storage could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/payments/cod/{partnerId}:
    get:
      tags: [payments]
      summary: A partner's cash-on-delivery ledger
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ledger" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/payments/cod/{partnerId}/reconcile:
    post:
      tags: [payments]
      summary: Mark a partner's held cash as remitted
      description: |
        Every collection id in the batch must belong to this partner and
        still be held, or none of them move — reconciled inside one
        transaction, so a partial remittance can never leave the ledger
        claiming half a handover happened when an operator meant all of it.
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection_ids, reference]
              properties:
                collection_ids: { type: array, items: { type: string }, minItems: 1 }
                reference:      { type: string, description: A receipt or deposit-slip reference for the handover }
      responses:
        "200":
          description: The ledger, after reconciling
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ledger" }
        "400":
          description: No collections were named, or no reference was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: One of those collections is not this partner's to remit, or has already been remitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payments could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/track/{orderId}:
    get:
      tags: [tracking]
      summary: Watch one delivery live
      description: |
        Server-Sent Events (`text/event-stream`). One frame on connect with
        the order's current status and, while a rider is carrying it, their
        last reported position; one more frame each time either changes;
        the connection closes once the order reaches a status with nothing
        left to watch. Open only to the order's own customer or the partner
        currently assigned to it — anyone else gets 404, the same answer a
        nonexistent order gets, so a stream cannot be used to probe whether
        an order id exists.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [bn, en] } }
      responses:
        "200":
          description: "A stream of TrackingSnapshot frames, each as an SSE data line"
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/TrackingSnapshot" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such order, or it is not the caller's to watch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Tracking could not be reached, or the connection could not be upgraded to a stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/device:
    post:
      tags: [notifications]
      summary: Register this device for push
      description: |
        Replaces whatever this account last registered on the same
        platform — a reinstalled app gets a new token, not a second row
        nothing will ever clean up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios, android] }
                token:    { type: string }
      responses:
        "204":
          description: Registered
        "400":
          description: An invalid platform, or no token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Notifications could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/notifications:
    get:
      tags: [notifications]
      summary: The caller's own notification history
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: The caller's notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Notifications could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/reviews:
    post:
      tags: [reviews]
      summary: Rate something from a delivered order
      description: |
        Eligibility is checked against the order itself: the caller must be
        its own customer, the order must be delivered, and the subject must
        be something that order actually involved — the shop it was placed
        with, an item it contained, or the partner whose delivery closed it.
        One review per person per subject per order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitReview" }
      responses:
        "200":
          description: The review that was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400":
          description: Malformed request, an invalid subject, or a rating outside 1-5
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The order named is not the caller's own
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The order is not yet delivered, or this was already reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [reviews]
      summary: A subject's own reviews
      parameters:
        - { name: subject,    in: query, required: true, schema: { $ref: "#/components/schemas/ReviewSubject" } }
        - { name: subject_id, in: query, required: true, schema: { type: string } }
        - { name: limit,      in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Reviews, newest first
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
        "400":
          description: An invalid or missing subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/ratings:
    get:
      tags: [reviews]
      summary: A subject's aggregate rating
      parameters:
        - { name: subject,    in: query, required: true, schema: { $ref: "#/components/schemas/ReviewSubject" } }
        - { name: subject_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The subject's mean rating and how many reviews it rests on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rating" }
        "400":
          description: An invalid or missing subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/support/tickets:
    post:
      tags: [reviews]
      summary: Raise a support ticket about an order
      description: |
        No delivered status is required — "this never arrived" is exactly
        the complaint a ticket exists to raise about an order still out for
        delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RaiseTicket" }
      responses:
        "200":
          description: The ticket that was opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "400":
          description: Malformed request, or no reason given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The order named is not the caller's own
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/me/support/tickets:
    get:
      tags: [reviews]
      summary: The caller's own support tickets
      responses:
        "200":
          description: The caller's tickets, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/SupportTicket" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/support/tickets:
    get:
      tags: [reviews]
      summary: The support queue — tickets nobody has resolved yet
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Open tickets, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/SupportTicket" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/admin/support/tickets/resolve:
    post:
      tags: [reviews]
      summary: Resolve a support ticket
      description: |
        A "refunded" resolution calls through to payment before the
        resolution is recorded — a ticket marked refunded whose refund never
        actually went through would tell a customer money is coming that
        will never arrive.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveTicket" }
      responses:
        "200":
          description: The resolved ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
        "400":
          description: Malformed request, or not a valid resolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: That ticket has already been resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The refund could not be processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token. See docs/build/phases/P04.md.

  schemas:
    Checkout:
      type: object
      required: [payment_id, order_id, status, status_label, amount]
      properties:
        payment_id:   { type: string }
        order_id:     { type: string }
        status:       { type: string, enum: [pending, captured, failed, refunded] }
        status_label: { type: string }
        amount:       { $ref: "#/components/schemas/Money" }
        redirect_url:
          type: string
          description: Where the customer's app sends them to pay. Empty on a resumed checkout whose attempt never recorded one.
        demo_completion:
          type: boolean
          description: |
            True only where the gateway is the manual stand-in *and* the
            deployment mounts `POST /v1/payments/manual/complete` — that is,
            outside production. It tells a client it may complete this payment
            itself rather than waiting for a bank that does not exist, which
            is what lets a demo show the prepaid flow end to end.

            Absent or false everywhere else. A client must treat it as false
            when it is missing.

    Payment:
      type: object
      required: [id, order_id, status, status_label, amount]
      properties:
        id:           { type: string }
        order_id:     { type: string }
        status:       { type: string, enum: [pending, captured, failed, refunded] }
        status_label: { type: string }
        amount:       { $ref: "#/components/schemas/Money" }
        reason:
          type: string
          description: Why it failed, or why it was refunded — empty otherwise.

    Collection:
      type: object
      description: One cash-on-delivery order's worth of cash, from the moment a rider collects it to the moment it is remitted.
      required: [id, order_id, amount, status, status_label]
      properties:
        id:             { type: string }
        order_id:       { type: string }
        amount:         { $ref: "#/components/schemas/Money" }
        status:         { type: string, enum: [held, remitted] }
        status_label:   { type: string }
        remittance_ref: { type: string }

    Ledger:
      type: object
      description: A delivery partner's cash position, always recomputed from their collections rather than kept as a stored figure.
      required: [partner_id, outstanding, remitted, held]
      properties:
        partner_id:  { type: string }
        outstanding: { $ref: "#/components/schemas/Money" }
        remitted:    { $ref: "#/components/schemas/Money" }
        held:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
          description: Held collections, oldest first — what a "please remit" screen lists.

    TrackingSnapshot:
      type: object
      description: One frame of a live delivery stream.
      required: [order_id, status, status_label, live]
      properties:
        order_id:     { type: string }
        status:       { type: string }
        status_label: { type: string }
        live:
          type: boolean
          description: False on the last frame a stream will ever send for this order.
        partner:
          $ref: "#/components/schemas/TrackingPartner"

    TrackingPartner:
      type: object
      description: Present only while a rider is carrying the order.
      required: [id, name, phone, vehicle, lat, lng]
      properties:
        id:      { type: string }
        name:    { type: string }
        phone:   { type: string }
        vehicle: { type: string }
        lat:     { type: number, format: double }
        lng:     { type: number, format: double }

    Notification:
      type: object
      required: [id, title, body, channel, status, created_at]
      properties:
        id:      { type: string }
        title:   { type: string }
        body:    { type: string }
        channel: { type: string, enum: [push, sms, none] }
        status:  { type: string, enum: [sent, failed] }
        created_at: { type: string, format: date-time }

    ReviewSubject:
      type: string
      enum: [merchant, partner, item]
      description: The three things a review can be about.

    SubmitReview:
      type: object
      required: [order_id, subject, subject_id, rating]
      properties:
        order_id:   { type: string }
        subject:    { $ref: "#/components/schemas/ReviewSubject" }
        subject_id: { type: string }
        rating:     { type: integer, minimum: 1, maximum: 5 }
        comment:    { type: string }

    Review:
      type: object
      required: [id, order_id, subject, subject_id, rating, created_at]
      properties:
        id:         { type: string }
        order_id:   { type: string }
        subject:    { $ref: "#/components/schemas/ReviewSubject" }
        subject_id: { type: string }
        rating:     { type: integer, minimum: 1, maximum: 5 }
        comment:    { type: string }
        created_at: { type: string, format: date-time }

    Rating:
      type: object
      required: [subject, subject_id, average, count]
      properties:
        subject:    { $ref: "#/components/schemas/ReviewSubject" }
        subject_id: { type: string }
        average:
          type: number
          format: double
          description: The mean rating out of 5, or 0 with a count of 0 for a subject nobody has reviewed yet.
        count: { type: integer }

    RaiseTicket:
      type: object
      required: [order_id, subject]
      properties:
        order_id: { type: string }
        subject:  { type: string, example: "Item arrived damaged" }

    ResolveTicket:
      type: object
      required: [ticket_id, resolution]
      properties:
        ticket_id:  { type: string }
        resolution: { type: string, enum: [refunded, rejected] }
        note:       { type: string }

    SupportTicket:
      type: object
      required: [id, order_id, subject, status, created_at]
      properties:
        id:          { type: string }
        order_id:    { type: string }
        subject:     { type: string }
        status:      { type: string, enum: [open, resolved] }
        resolution:  { type: string, enum: [refunded, rejected] }
        note:        { type: string }
        agent_id:    { type: string }
        created_at:  { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    DeliveryPartner:
      type: object
      required: [id, name, phone, availability, availability_label, preference, preference_label, lat, lng, carrying, acceptance_percent]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        vehicle: { type: string }
        availability: { type: string, enum: [offline, available, busy] }
        availability_label: { type: string, example: "কাজের জন্য প্রস্তুত" }
        preference:
          type: string
          enum: [short, long, any]
          description: D4's distance choice. `any` is the default — a partner who has not chosen has not chosen to exclude anything.
        preference_label: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        carrying: { type: integer, description: How many live deliveries they hold. }
        acceptance_percent:
          type: integer
          description: |
            The share of offers taken, as a whole number. A partner with no
            offers yet reads 100 rather than 0: the alternative punishes
            somebody for being new, which is the surest way to have no new
            partners.

    DeliveryPlace:
      type: object
      required: [name, lat, lng]
      properties:
        name: { type: string }
        phone: { type: string }
        single_line: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    DeliveryJob:
      type: object
      required: [id, order_id, code, status, status_label, live, band, band_label, distance_m, distance, pickup, destination]
      properties:
        id: { type: string }
        order_id: { type: string }
        code:
          type: string
          description: The order's short reference, so a rider and a shopkeeper say the same six characters to each other.
        status:
          type: string
          enum: [waiting, offered, assigned, collected, delivered, failed, cancelled]
          description: |
            Deliberately not the order's status. An order is the customer's view
            of the thing; a job is the platform's view of getting it moved, and
            they diverge — an order sitting at `ready` may have been offered to
            four partners and declined by three.
        status_label: { type: string }
        live: { type: boolean }
        band:
          type: string
          enum: [short, long, beyond]
          description: |
            D4's classification, computed once against the area's ceilings when
            the job was created. `beyond` is past even the long ceiling and is
            offered to everybody working rather than to nobody — an order that
            no preference covers is an order that sits there.
        band_label: { type: string }
        distance_m: { type: number, format: double, description: Pickup to door. }
        distance: { type: string, example: "৩.২ কিমি" }
        to_pickup_m: { type: number, format: double, description: How far the rider is from the counter. }
        to_pickup: { type: string }
        pickup: { $ref: "#/components/schemas/DeliveryPlace" }
        destination: { $ref: "#/components/schemas/DeliveryPlace" }
        reason: { type: string }
        seconds_left:
          type: integer
          description: |
            How long is left to answer an offer, from the server's clock. A
            rider's phone clock is wrong often enough that a countdown from it
            would expire at the wrong moment, which on an offer is the
            difference between a job and a wasted trip.

    PartnerFeed:
      type: object
      required: [partner, jobs, radius_m]
      properties:
        partner: { $ref: "#/components/schemas/DeliveryPartner" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/DeliveryJob" }
        radius_m: { type: number, format: double, description: "`dispatch.partner_radius` where this partner is standing." }
        reason:
          type: string
          enum: [offline, at_capacity, nothing_nearby]
          description: Why the list is empty, when it is.
        notice: { type: string, description: The sentence to show, composed by the server. }

    DeliveryJobList:
      type: object
      required: [jobs, total]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/DeliveryJob" }
        total: { type: integer }

    OrderStatus:
      type: string
      description: |
        Where an order is. The four terminal states — `delivered`, `cancelled`,
        `rejected`, `failed` — have no moves out of them.

        `rejected` is separate from `cancelled` because they are different facts
        about different people: a shop that rejects often is a shop an admin
        needs to see.
      enum: [pending_payment, placed, accepted, preparing, ready, picked_up, delivered, cancelled, rejected, failed]

    OrderLine:
      type: object
      description: |
        One thing that was bought, at the price it was bought for. A copy, not a
        reference: an order is a record of an agreement, and a shop renaming an
        item must not rename it on last week's receipt.
      required: [id, kind, target_id, name, options, quantity, unit_price, line_total]
      properties:
        id: { type: string }
        kind: { type: string, enum: [item, combo] }
        target_id: { type: string, description: What it was, so a reorder button has something to point at. }
        name: { type: string }
        options:
          type: array
          items:
            type: object
            required: [name, price]
            properties:
              name: { type: string }
              price: { $ref: "#/components/schemas/Money" }
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
        unit_price: { $ref: "#/components/schemas/Money" }
        line_total: { $ref: "#/components/schemas/Money" }

    OrderPlace:
      type: object
      description: One end of the delivery, copied onto the order at placement.
      required: [name, lat, lng]
      properties:
        name: { type: string }
        phone: { type: string }
        single_line: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    OrderEvent:
      type: object
      description: |
        One thing that happened. The history is kept rather than derived: "when
        did the shop accept it" is a question the customer asks and a status
        column alone cannot answer.
      required: [status, label, actor, at]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        label: { type: string, description: The status in words, composed by the server. }
        actor: { type: string, enum: [customer, merchant, partner, admin, system] }
        reason: { type: string }
        at: { type: string, format: date-time }

    OrderCancellation:
      type: object
      description: |
        Whether the customer may still call the order off. The window runs from
        placement rather than acceptance: a customer changes their mind about
        the decision they made, and a shop that takes six minutes to accept
        should not thereby shorten the time they had.
      required: [allowed, seconds_left, free_until]
      properties:
        allowed: { type: boolean }
        reason:
          type: string
          enum: [already_finished, too_late, already_preparing]
        text: { type: string, description: The sentence to show, composed by the server. }
        seconds_left:
          type: integer
          description: Drives a countdown. From the server's clock, which is the one that decides.
        free_until: { type: string, format: date-time }

    Order:
      type: object
      required: [id, code, merchant_id, status, status_label, live, payment_method, lines, count, subtotal, delivery, total, receipt, pickup, destination, events, next_actions, cancel, placed_at, updated_at]
      properties:
        id: { type: string }
        merchant_id:
          type: string
          description: |
            The shop, so the customer's app can name a review subject it is
            entitled to review. P16 refuses a review whose subject was not on
            the order, which a client with no id could never satisfy.
        partner_id:
          type: string
          description: |
            The rider who collected the order, taken from the `picked_up`
            event. Absent until one has.
        code:
          type: string
          description: |
            The short reference a customer reads out on the phone. Drawn from an
            alphabet with no I, O, 0 or 1 — the characters people confuse over a
            bad line in a second language.
        status: { $ref: "#/components/schemas/OrderStatus" }
        status_label: { type: string, example: "রান্না হচ্ছে" }
        live: { type: boolean, description: Still going, so a client branches on one boolean rather than keeping a copy of which statuses are terminal. }
        payment_method: { type: string, enum: [cash, online] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        count: { type: integer }
        subtotal: { $ref: "#/components/schemas/Money" }
        delivery: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        receipt:
          type: array
          description: The frozen receipt, rebuilt from what was written down rather than re-quoted.
          items: { $ref: "#/components/schemas/ReceiptRow" }
        expanded: { type: boolean, description: Whether this delivery crossed the base radius (D2). }
        distance_m: { type: number, format: double }
        pickup: { $ref: "#/components/schemas/OrderPlace" }
        destination: { $ref: "#/components/schemas/OrderPlace" }
        events:
          type: array
          items: { $ref: "#/components/schemas/OrderEvent" }
        next_actions:
          type: array
          description: |
            What *this caller* may do now, straight from the state machine. A
            client with its own copy of the transition table would offer a shop
            an Accept button on an order somebody already cancelled (2.9).
          items: { $ref: "#/components/schemas/OrderStatus" }
        cancel: { $ref: "#/components/schemas/OrderCancellation" }
        placed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderList:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        total: { type: integer, description: Matches before paging. }

    CartOption:
      type: object
      required: [group_id, option_id, name, price]
      properties:
        group_id: { type: string }
        option_id: { type: string }
        name: { type: string }
        price: { $ref: "#/components/schemas/Money" }

    CartLine:
      type: object
      required: [id, kind, target_id, name, options, quantity, unit_price, line_total, orderable]
      properties:
        id: { type: string }
        kind: { type: string, enum: [item, combo] }
        target_id: { type: string }
        name: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/CartOption" }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        note: { type: string }
        unit_price:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The price of one, options included, as the shop charges it **now**.
        line_total: { $ref: "#/components/schemas/Money" }
        issue:
          type: string
          enum: [price_changed, out_of_stock, not_available_now, unavailable, removed]
          description: |
            What changed since the customer added this, or absent when nothing
            did. `price_changed` leaves the line orderable — at the new price,
            shown — because the customer may well still want it.
        issue_text:
          type: string
          description: The sentence to show, composed by the server, Bengali unless `lang=en`.
        orderable: { type: boolean }

    Cart:
      type: object
      required: [id, merchant_id, merchant_name, lines, count, subtotal, orderable]
      properties:
        id: { type: string }
        merchant_id: { type: string }
        merchant_name: { type: string }
        merchant_logo_url: { type: string }
        merchant_status:
          type: string
          description: The shop's open status, so a cart screen needs no second request.
        address_id: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        count:
          type: integer
          description: How many individual things are in it — the badge on the cart icon.
        subtotal:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            What the goods cost at their current prices. Delivery, surcharges
            and the grand total are pricing's, not the cart's — a cart that
            worked out the fee itself would be a second implementation of
            ALG-05, and the second one is always the one that is wrong.
        orderable:
          type: boolean
          description: |
            The single answer checkout branches on. A client that worked this
            out from the line issues would be deciding eligibility, which 2.9
            forbids.
        blocker:
          type: string
          enum: [empty, no_address, shop_unavailable, shop_closed, outside_division, beyond_radius, line_problems]
          description: |
            Why checkout is unavailable. `outside_division` is permanent: D3
            makes that address unreachable from this shop at any radius.
        blocker_text:
          type: string
          description: The sentence to show, composed by the server.
        pricing: { $ref: "#/components/schemas/CartPricing" }

    ReceiptRow:
      type: object
      description: |
        One line of the receipt, composed by the server. `key` is what the row
        is, so a client can style it without parsing the label, and `label` is
        the words to show — Bengali unless `lang=en`.
      required: [key, label, amount]
      properties:
        key:
          type: string
          enum: [subtotal, delivery, expansion_surcharge, free_delivery, total]
        label: { type: string, example: "ডেলিভারি চার্জ" }
        amount: { $ref: "#/components/schemas/Money" }

    CartPricing:
      type: object
      description: |
        ALG-05 applied to this cart. Absent when there is nothing true to quote
        — no delivery address chosen, or an address this shop cannot deliver to
        — because a delivery charge for a journey that cannot happen is a number
        the customer would reasonably take for a promise.
      required: [delivery, delivery_before_waiver, expansion_surcharge, free_delivery, total, distance_m, expanded, rows]
      properties:
        delivery:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What the customer pays, after any waiver.
        delivery_before_waiver:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What it would have cost. Equal to `delivery` unless free delivery applied.
        expansion_surcharge:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The part of the fee that exists only because the radius was widened (D2).
        free_delivery: { type: boolean }
        free_delivery_at:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            The order value that earns the waiver, or zero when the promotion is
            off here. Free delivery applies only at the base radius: letting it
            survive an expansion would give a free ride across the division and
            break D2.
        away_from_free_delivery:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            How much more would earn it, so a client can say "৳120 more for free
            delivery" without holding the threshold itself (2.9).
        total: { $ref: "#/components/schemas/Money" }
        distance_m: { type: number, format: double }
        expanded: { type: boolean }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReceiptRow" }
        notice:
          type: string
          description: The one line under the total, or absent when there is nothing to say.

    CartAddRequest:
      type: object
      required: [merchant_id, kind, target_id, quantity]
      properties:
        merchant_id: { type: string }
        kind: { type: string, enum: [item, combo] }
        target_id: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        choices:
          type: array
          description: The variant and add-on choices, as ids. Prices are never sent by the client.
          items:
            type: object
            required: [group_id, option_id]
            properties:
              group_id: { type: string }
              option_id: { type: string }
        note: { type: string, maxLength: 200 }

    DeliveryFee:
      type: object
      description: |
        A delivery charge in both forms: the integer to compute with and the
        string to render. A client that formatted money itself would eventually
        format it differently from the receipt (2.9).
      required: [minor, currency, display, expanded]
      properties:
        minor: { type: integer, format: int64, description: Amount in poisha. }
        currency: { type: string, example: BDT }
        display: { type: string, example: "৳ 90" }
        expanded:
          type: boolean
          description: |
            Whether an expansion surcharge was applied, so the app can say why
            the fee is higher instead of leaving the customer to guess (D2).
        surcharge_minor:
          type: integer
          format: int64
          description: |
            How much of the fee exists only because the customer widened the
            radius. Absent at the base radius.

    DiscoveryExpansion:
      type: object
      description: |
        The whole expansion decision, already made by the server. A client that
        worked out whether to offer a wider search would be deciding visibility,
        which 2.9 forbids, and would need a copy of three configuration values
        to do it.
      required: [level, radius_m, radius, stage, can_expand, offered, at_ceiling]
      properties:
        level: { type: integer, description: "Expansion level searched at, 0 being the base radius." }
        radius_m: { type: number, format: double }
        radius: { type: string, example: "৫ কিমি" }
        stage:
          type: string
          enum: [base, expanded, ceiling]
          description: |
            `ceiling` is terminal. D3 stops expansion at the division boundary,
            so this is the end of what the customer can ever see — not a step
            that happens to be last.
        can_expand: { type: boolean }
        offered:
          type: boolean
          description: |
            Whether to *prompt* the customer to expand, as opposed to merely
            allowing it. A customer looking at forty restaurants does not need a
            button suggesting they look further and pay more.
        at_ceiling: { type: boolean }
        next_level: { type: integer }
        next_radius_m: { type: number, format: double }
        next_radius: { type: string }

    DiscoveryMerchant:
      type: object
      description: One shop on the customer's list, with every field final.
      required: [id, name, type, lat, lng, distance_m, distance, is_open_now, open_status, delivery]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [restaurant, grocery, pharmacy] }
        logo_url: { type: string }
        phone: { type: string }
        area_name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        distance_m: { type: number, format: double }
        distance: { type: string, example: "১.২ কিমি" }
        is_open_now: { type: boolean }
        open_status: { type: string, example: "খোলা আছে — বন্ধ হবে 22:00" }
        delivery: { $ref: "#/components/schemas/DeliveryFee" }

    DiscoverySearch:
      type: object
      required: [division, notice, total, expansion, merchants]
      properties:
        division: { type: string }
        area_name: { type: string }
        notice:
          type: string
          description: |
            The one line to show above the list — nothing found, expansion
            offered, or the division ceiling reached. Composed by the server so
            every client says the same thing.
        total: { type: integer, description: Matches before paging. }
        expansion: { $ref: "#/components/schemas/DiscoveryExpansion" }
        merchants:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryMerchant" }

    DiscoveryReach:
      type: object
      required: [merchant_id, distance_m, distance, reachable, required_level, expanded]
      properties:
        merchant_id: { type: string }
        distance_m: { type: number, format: double }
        distance: { type: string }
        reachable: { type: boolean }
        required_level:
          type: integer
          description: |
            Expansion level needed to see this shop, 0 when it is inside the
            base radius. Meaningless when `reachable` is false.
        expanded: { type: boolean }
        reason:
          type: string
          enum: [outside_division, beyond_max_radius]
          description: |
            Why an unreachable shop is unreachable. `outside_division` is
            permanent — D3 makes it unreachable at any radius.

    Unit:
      type: string
      description: How an item is sold. Required for grocery and pharmacy items.
      enum: [piece, kg, g, litre, ml, pack, strip, bottle]

    CatalogueCapabilities:
      type: object
      description: |
        What a catalogue of this shop type may contain. This is the per-type
        schema difference, served so the app never decides it for itself.
      required: [merchant_type, variants, addons, combos, tracks_stock, requires_unit, prescriptions, units]
      properties:
        merchant_type: { $ref: "#/components/schemas/MerchantType" }
        variants:      { type: boolean }
        addons:        { type: boolean, description: Restaurants only }
        combos:        { type: boolean }
        tracks_stock:  { type: boolean, description: Grocery and pharmacy count a shelf }
        requires_unit: { type: boolean }
        prescriptions: { type: boolean, description: Pharmacy only }
        units:
          type: array
          description: The units of sale to offer. Empty when this type has none.
          items: { $ref: "#/components/schemas/Unit" }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:       { type: string, example: "Kacchi and biryani" }
        sort_order: { type: integer, description: Omit to append to the end }

    Category:
      type: object
      required: [id, name, sort_order, active]
      properties:
        id:         { type: string }
        name:       { type: string }
        sort_order: { type: integer }
        active:     { type: boolean }

    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    ActiveInput:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    StockInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 0 }

    AvailabilityInput:
      type: object
      description: |
        Either always, or a weekly timetable keyed by weekday number with Sunday
        as "0", each window written HH:MM-HH:MM in Bangladesh local time.
        Windows may not overlap and may not wrap past midnight.
      properties:
        always: { type: boolean }
        days:
          type: object
          additionalProperties:
            type: array
            items: { type: string, example: "07:00-11:00" }

    OptionInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          description: |
            Send an existing option's id to keep it. A new id would invalidate
            every cart holding that choice.
        name:        { type: string, example: "Large" }
        price_minor: { type: integer, format: int64, description: A delta for a variant, a price for an add-on }
        available:   { type: boolean }

    OptionGroupInput:
      type: object
      required: [name, options]
      properties:
        id:          { type: string }
        name:        { type: string, example: "Size" }
        required:    { type: boolean }
        min_choices: { type: integer, minimum: 0 }
        max_choices: { type: integer, minimum: 1 }
        sort_order:  { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/OptionInput" }

    OptionGroupsInput:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/OptionGroupInput" }

    Option:
      type: object
      required: [id, name, price, available]
      properties:
        id:        { type: string }
        name:      { type: string }
        price:     { $ref: "#/components/schemas/Money" }
        available: { type: boolean }

    OptionGroup:
      type: object
      required: [id, name, required, min_choices, max_choices, options]
      properties:
        id:          { type: string }
        name:        { type: string }
        required:    { type: boolean }
        min_choices: { type: integer }
        max_choices: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }

    ItemInput:
      type: object
      description: |
        Which fields are allowed depends on the shop's type - see
        CatalogueCapabilities. A field this kind of shop does not have is
        refused, not dropped, so an owner never loses something they typed.
      required: [category_id, name, price_minor]
      properties:
        category_id: { type: string }
        name:        { type: string }
        description: { type: string }
        image_url:   { type: string, description: A path we serve, or an https URL }
        price_minor: { type: integer, format: int64, minimum: 0 }
        sort_order:  { type: integer }
        is_vegetarian:       { type: boolean, description: Restaurant only }
        preparation_minutes: { type: integer, minimum: 0, description: Restaurant only }
        unit:      { $ref: "#/components/schemas/Unit" }
        pack_size: { type: string, example: "1 kg" }
        brand:     { type: string }
        generic_name:          { type: string, description: Pharmacy only }
        strength:              { type: string, example: "500mg", description: Pharmacy only }
        requires_prescription: { type: boolean, description: Pharmacy only }
        stock_quantity:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Omit to leave the shelf count alone. Only meaningful where the shop
            type counts stock.

    PublicItem:
      type: object
      description: An item as a customer sees it. No shelf count, no visibility switch.
      required: [id, merchant_id, category_id, name, price, orderable, variant_groups, addon_groups]
      properties:
        id:          { type: string }
        merchant_id: { type: string }
        category_id: { type: string }
        name:        { type: string }
        description: { type: string }
        image_url:   { type: string }
        price:       { $ref: "#/components/schemas/Money" }
        orderable:
          type: boolean
          description: Decided by the server from the item's switch, its stock and its schedule
        unavailable_reason:
          type: string
          enum: [out_of_stock, not_available_now, unavailable]
          description: Present only when orderable is false
        unit:                  { $ref: "#/components/schemas/Unit" }
        pack_size:             { type: string }
        brand:                 { type: string }
        generic_name:          { type: string }
        strength:              { type: string }
        requires_prescription: { type: boolean }
        is_vegetarian:         { type: boolean }
        preparation_minutes:   { type: integer }
        variant_groups:
          type: array
          items: { $ref: "#/components/schemas/OptionGroup" }
        addon_groups:
          type: array
          items: { $ref: "#/components/schemas/OptionGroup" }

    Item:
      allOf:
        - $ref: "#/components/schemas/PublicItem"
        - type: object
          description: The owner's view, which adds what only an owner needs.
          properties:
            active:         { type: boolean }
            stock_tracked:  { type: boolean }
            stock_quantity: { type: integer, nullable: true }
            availability:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            sort_order: { type: integer }

    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }

    BulkItemChange:
      type: object
      description: |
        Every field is optional so "leave this alone" and "set this" stay
        different instructions. A re-pricing that had to send stock counts back
        would zero a shop's inventory the first time one was forgotten.
      required: [item_id]
      properties:
        item_id:        { type: string }
        price_minor:    { type: integer, format: int64, minimum: 0, nullable: true }
        stock_quantity: { type: integer, minimum: 0, nullable: true }
        active:         { type: boolean, nullable: true }

    BulkItemUpdate:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/BulkItemChange" }

    ComboLineInput:
      type: object
      required: [item_id, quantity]
      properties:
        item_id:  { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10 }

    ComboInput:
      type: object
      required: [name, price_minor, lines]
      properties:
        name:        { type: string }
        description: { type: string }
        image_url:   { type: string }
        price_minor: { type: integer, format: int64, minimum: 0 }
        sort_order:  { type: integer }
        lines:
          type: array
          minItems: 2
          maxItems: 20
          items: { $ref: "#/components/schemas/ComboLineInput" }

    ComboLine:
      type: object
      required: [item_id, quantity]
      properties:
        item_id:  { type: string }
        name:     { type: string }
        quantity: { type: integer }

    Combo:
      type: object
      required: [id, merchant_id, name, price, lines]
      properties:
        id:          { type: string }
        merchant_id: { type: string }
        name:        { type: string }
        description: { type: string }
        image_url:   { type: string }
        price:       { $ref: "#/components/schemas/Money" }
        savings:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            What the bundle saves against buying its parts, computed by the
            server. Absent on the owner's own view.
        lines:
          type: array
          items: { $ref: "#/components/schemas/ComboLine" }
        orderable:
          type: boolean
          description: False when any member item is unavailable
        active:      { type: boolean }
        availability:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        sort_order: { type: integer }

    ComboList:
      type: object
      required: [combos]
      properties:
        combos:
          type: array
          items: { $ref: "#/components/schemas/Combo" }

    Menu:
      type: object
      description: A shop's whole catalogue, as a customer sees it.
      required: [merchant_id, categories, items, combos]
      properties:
        merchant_id: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicItem" }
        combos:
          type: array
          items: { $ref: "#/components/schemas/Combo" }


    MerchantType:
      type: string
      enum: [restaurant, grocery, pharmacy]

    MerchantStatus:
      type: string
      description: |
        Where a shop sits in the approval workflow. Only `approved` is visible
        to customers, and only then when it is not on holiday.
      enum: [draft, pending_review, approved, rejected, suspended]

    MerchantDocumentKind:
      type: string
      enum: [trade_licence, national_id, food_licence, drug_licence]

    MerchantDetailsInput:
      type: object
      required: [name, type, phone, line1, lat, lng]
      properties:
        name:     { type: string, example: "নূরজাহান হোটেল" }
        type:     { $ref: "#/components/schemas/MerchantType" }
        phone:    { type: string, example: "01712345678" }
        email:    { type: string, example: "shop@example.com" }
        logo_url: { type: string, example: "/static/demo/merchant-logo-01.png" }
        line1:    { type: string, example: "১২/এ, মিরপুর রোড" }
        line2:    { type: string }
        lat:      { type: number, format: double, example: 23.7509 }
        lng:      { type: number, format: double, example: 90.3925 }

    MerchantDocumentInput:
      type: object
      required: [kind, number, file_url]
      properties:
        kind:     { $ref: "#/components/schemas/MerchantDocumentKind" }
        number:   { type: string, example: "TRAD/DNCC/012345" }
        file_url: { type: string, example: "/static/demo/document-01.png" }

    MerchantHoursInput:
      type: object
      required: [days]
      description: |
        Opening hours keyed by weekday number, Sunday as `"0"`, each window
        written `HH:MM-HH:MM` in Bangladesh local time. A day left out is
        closed. Windows may not overlap and may not wrap past midnight: a shop
        trading until 2am enters `22:00-24:00` and `00:00-02:00` on the next
        day.
      properties:
        days:
          type: object
          additionalProperties:
            type: array
            items: { type: string, example: "09:00-22:00" }

    MerchantHolidayInput:
      type: object
      properties:
        until:
          type: string
          format: date-time
          description: When the shop reopens. Omit for indefinitely.
        reason: { type: string, example: "ঈদের ছুটি" }

    MerchantDecisionInput:
      type: object
      description: |
        The note an admin attaches to a decision. Required for a rejection or a
        suspension, because the owner reads it; optional for an approval.
      properties:
        note: { type: string }

    MerchantDocument:
      type: object
      required: [kind, number, file_url, uploaded_at]
      properties:
        kind:        { $ref: "#/components/schemas/MerchantDocumentKind" }
        number:      { type: string }
        file_url:    { type: string }
        uploaded_at: { type: string, format: date-time }

    MerchantStatusEvent:
      type: object
      required: [id, from, to, actor_user_id, at]
      properties:
        id:            { type: string }
        from:          { $ref: "#/components/schemas/MerchantStatus" }
        to:            { $ref: "#/components/schemas/MerchantStatus" }
        actor_user_id: { type: string }
        note:          { type: string }
        at:            { type: string, format: date-time }

    RegistrationRequirements:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            type: object
            required: [type, required_documents]
            properties:
              type: { $ref: "#/components/schemas/MerchantType" }
              required_documents:
                type: array
                items: { $ref: "#/components/schemas/MerchantDocumentKind" }

    Merchant:
      type: object
      description: |
        A shop, as its owner and an admin see it. `open_status` is composed by
        the server and rendered verbatim by the client (2.9); the client never
        decides for itself whether a shop is open from the hours.
      required:
        [id, owner_user_id, name, type, status, phone, line1, single_line,
         lat, lng, area_code, area_name, district_code, division_code,
         is_listed, is_open_now, open_status, hours, documents,
         required_documents, missing_documents, can_submit, next_statuses,
         created_at]
      properties:
        id:            { type: string, example: mch_01J8ZQ8F3K7YQ2N4V5W6X7Y8Z9 }
        owner_user_id: { type: string }
        name:          { type: string }
        type:          { $ref: "#/components/schemas/MerchantType" }
        status:        { $ref: "#/components/schemas/MerchantStatus" }
        phone:         { type: string, example: "+8801712345678" }
        email:         { type: string }
        logo_url:      { type: string }
        line1:         { type: string }
        line2:         { type: string }
        single_line:   { type: string, description: The whole address as one line, composed by the server }
        lat:           { type: number, format: double }
        lng:           { type: number, format: double }
        area_code:     { type: string }
        area_name:     { type: string }
        district_code: { type: string }
        division_code: { type: string, description: The D3 ceiling — a customer outside this division can never see the shop }
        is_listed:     { type: boolean, description: Approved and not on holiday }
        is_open_now:   { type: boolean, description: Listed and inside an opening window }
        open_status:   { type: string, example: "খোলা আছে — বন্ধ হবে 22:00" }
        hours:
          type: object
          additionalProperties:
            type: array
            items: { type: string, example: "09:00-22:00" }
        holiday:
          type: object
          properties:
            until:  { type: string, format: date-time }
            reason: { type: string }
        documents:
          type: array
          items: { $ref: "#/components/schemas/MerchantDocument" }
        required_documents:
          type: array
          items: { $ref: "#/components/schemas/MerchantDocumentKind" }
        missing_documents:
          type: array
          items: { $ref: "#/components/schemas/MerchantDocumentKind" }
        can_submit:    { type: boolean, description: Whether the owner may submit for review right now }
        next_statuses:
          type: array
          items: { $ref: "#/components/schemas/MerchantStatus" }
        review_note:   { type: string, description: Why the shop was rejected or suspended }
        created_at:    { type: string, format: date-time }

    Money:
      type: object
      description: |
        Money is always transported as both a minor-unit integer and a
        preformatted display string. The client renders `display` and never
        computes with `minor`.
      required: [minor, currency, display]
      properties:
        minor:    { type: integer, format: int64, example: 124000 }
        currency: { type: string, example: BDT }
        display:  { type: string, example: "৳ 1,240" }

    Capability:
      type: object
      description: |
        Whether the user may take an action, decided by the server. When
        `allowed` is false, `reason` is human-readable and safe to show.
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason:  { type: string, example: "Minimum order for this zone is ৳ 250" }

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, example: invalid_refresh_token }
        message: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
          description: |
            Structured context, such as which parameter was rejected. Never
            present on a 500: an internal error's own message may name a table
            or a host, so it is replaced with a generic one before it leaves
            the process.

    ErrorResponse:
      type: object
      description: |
        Every failure uses this envelope, so a client can branch on the body
        shape alone without inspecting the status code first.
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    Profile:
      type: object
      required: [user_id, name, display_name, language]
      properties:
        user_id: { type: string }
        name:
          type: string
          description: May be empty. A customer can order without giving one.
        display_name:
          type: string
          description: |
            Never empty. The server decides the fallback so two clients do not
            invent two different greetings for the same nameless customer.
        email:    { type: string }
        language: { type: string, enum: [bn, en] }

    AddressInput:
      type: object
      required: [recipient_name, recipient_phone, line1, lat, lng]
      properties:
        label: { type: string, maxLength: 40, example: Home }
        recipient_name:
          type: string
          maxLength: 80
          description: |
            May differ from the account holder: people send food to their
            parents, and the rider needs whoever will open the door.
        recipient_phone: { type: string, example: "01712345678" }
        line1:           { type: string, maxLength: 200 }
        line2:           { type: string, maxLength: 200 }
        instructions:    { type: string, maxLength: 300, example: "Third floor, blue gate" }
        lat:
          type: number
          format: double
          description: |
            Where the rider goes. (0, 0) is refused: it is in the Gulf of
            Guinea and is almost always an unset variable rather than a place
            someone lives.
        lng:          { type: number, format: double }
        make_default: { type: boolean }

    Address:
      type: object
      required: [id, label, recipient_name, recipient_phone, line1, single_line, lat, lng, area_code, district_code, division_code, is_default]
      properties:
        id:              { type: string }
        label:           { type: string }
        recipient_name:  { type: string }
        recipient_phone: { type: string }
        line1:           { type: string }
        line2:           { type: string }
        instructions:    { type: string }
        single_line:
          type: string
          description: |
            Composed by the server. Every surface that shows an address — the
            app, a receipt, the rider's screen — shows this same string, because
            a client that joins the parts itself will eventually join them
            differently (2.9).
        lat:           { type: number, format: double }
        lng:           { type: number, format: double }
        area_code:     { type: string, example: DHK-DHM }
        area_name:     { type: string, example: Dhanmondi }
        district_code: { type: string, example: DHK }
        division_code: { $ref: "#/components/schemas/Area/properties/division_code" }
        is_default:    { type: boolean }

    Role:
      type: string
      enum: [customer, partner, merchant, admin]
      description: |
        The four roles. Every endpoint declares which it admits; admin is not a
        silent superset, so an admin token reaching a partner endpoint is
        refused rather than quietly allowed (2.7).

    TokenPair:
      type: object
      description: |
        What a client stores after signing in or refreshing. The refresh token
        goes to secure storage (Keystore / Keychain); the access token stays in
        memory and is never written to disk.
      required: [access_token, refresh_token, token_type, expires_in, role, user_id, session_id]
      properties:
        access_token:
          type: string
          description: |
            A short-lived JWT. Clients do not decode it: deciding when a token
            is valid is a business rule, and a client that decides for itself
            is a client that disagrees with the server (2.9).
        refresh_token:
          type: string
          description: |
            Opaque and single-use. The server stores only a SHA-256 hash, so a
            dump of the session store cannot be used to sign in as anyone.
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          format: int64
          example: 900
          description: Seconds until the access token expires, stated by the server.
        role:       { $ref: "#/components/schemas/Role" }
        user_id:    { type: string }
        session_id: { type: string }
        new_user:
          type: boolean
          description: |
            True only on a first sign-in, so the app knows to collect a name
            rather than inferring it from an empty profile. Absent on a refresh.

    DeviceSession:
      type: object
      required: [session_id, device, created_at, last_seen_at, current]
      properties:
        session_id:   { type: string }
        device:       { type: string, example: "Pixel 8" }
        created_at:   { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Marks the session making this request, so the UI can label it.

    ConfigScopeLevel:
      type: string
      enum: [area, district, division, global]
      description: |
        How specific a setting is. Resolution goes area → district → division →
        global and the first match wins (Appendix B).

    ConfigValueType:
      type: string
      enum: [count, bool, ratio, money_minor, distance_m, duration_s]
      description: |
        Money, distance and duration are separate types rather than all being
        "a number", because the unit is the part people get wrong. Money is
        always minor units; distance is always metres.

    ConfigDefinition:
      type: object
      required: [key, type, default, auto_tunable, immutable, purpose]
      properties:
        key:          { type: string, example: pricing.delivery_base }
        type:         { $ref: "#/components/schemas/ConfigValueType" }
        unit:         { type: string, example: BDT }
        default:      { type: string, example: "4000" }
        minimum:      { type: string, description: Absent for booleans, which have no order. }
        maximum:      { type: string }
        auto_tunable: { type: boolean, description: Whether ALG-09 may adjust it. }
        immutable:
          type: boolean
          description: |
            True only for discovery.division_ceiling. Nothing may change it —
            not an admin, not the tuner, not a direct database write.
        purpose:      { type: string }

    EffectiveValue:
      type: object
      required: [key, type, value, source]
      properties:
        key:    { type: string }
        type:   { $ref: "#/components/schemas/ConfigValueType" }
        value:  { type: string, description: Canonical text form; parse according to `type`. }
        source:
          type: string
          example: "area:DHK-DHM"
          description: The scope this value came from, or "global".

    SetConfigOverride:
      type: object
      required: [key, level, value, reason]
      properties:
        key:   { type: string, example: pricing.delivery_base }
        level: { $ref: "#/components/schemas/ConfigScopeLevel" }
        code:  { type: string, description: The area, district or division code. Must be empty for global. }
        value: { type: string, example: "6000" }
        pinned:
          type: boolean
          description: Stop the auto-tuner changing this variable in this scope.
        reason: { type: string, example: "Dhanmondi traffic has got worse" }

    ClearConfigOverride:
      type: object
      required: [key, level, reason]
      properties:
        key:    { type: string }
        level:  { $ref: "#/components/schemas/ConfigScopeLevel" }
        code:   { type: string }
        reason: { type: string }

    ConfigChange:
      type: object
      description: One entry in the configuration audit log (D5).
      required: [id, key, scope, old_value, new_value, actor, reason, changed_at]
      properties:
        id:        { type: string }
        key:       { type: string }
        scope:     { type: string, example: "area:DHK-DHM" }
        old_value: { type: string }
        new_value: { type: string }
        actor:     { type: string, example: "admin:adm_1" }
        reason:    { type: string }
        changed_at: { type: string, format: date-time }

    AutoTuneRequest:
      type: object
      description: One ALG-09 pass over an area's radii, driven by an operator-supplied or scheduled-job signal.
      required: [area, merchants_nearby, order_failure_rate]
      properties:
        area:     { type: string, example: DHK-DHM }
        district: { type: string, example: DHK }
        division: { type: string, example: DHA }
        merchants_nearby:
          type: integer
          description: Merchants discoverable near this area right now.
        order_failure_rate:
          type: number
          format: double
          description: Fraction of recent orders in this area that failed to deliver.

    TuneOutcome:
      type: object
      description: What ALG-09 did, or did not do, with one variable.
      required: [key, applied]
      properties:
        key:     { type: string, example: discovery.base_radius }
        applied: { type: boolean }
        skipped:
          type: string
          enum: [no_change_needed, pinned]
          description: Present only when applied is false.
        change: { $ref: "#/components/schemas/ConfigChange" }

    Area:
      type: object
      description: The administrative placement of a coordinate.
      required: [area_code, area_name, district_code, division_code, division_name]
      properties:
        area_code:     { type: string, example: DHK-DHM }
        area_name:     { type: string, example: Dhanmondi }
        district_code: { type: string, example: DHK }
        division_code:
          type: string
          enum: [DHA, CTG, KHU, RAJ, BAR, SYL, RAN, MYM]
          description: |
            One of Bangladesh's eight divisions. This is the hard geographic
            boundary of the system: radius expansion can never cross it (D3),
            and no admin setting can disable that.
        division_name: { type: string, example: Dhaka }

    NearbyMerchant:
      type: object
      required: [merchant_id, lat, lng, distance_m]
      properties:
        merchant_id: { type: string, example: MER-DEMO-0001 }
        lat:         { type: number, format: double }
        lng:         { type: number, format: double }
        distance_m:
          type: number
          format: double
          description: |
            Straight-line distance from the search centre, computed by the
            server. The client displays it and never recalculates it.

security:
  - bearerAuth: []
